<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Kupon Mentah - Tanpa Numerator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;0,900;1,800&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* ===== Pengaturan khusus Master PDF ===== */
        /* Mengatur ukuran halaman PDF persis sebesar ukuran 1 kupon */
        @page { 
            size: 135mm 50mm; 
            margin: 0; 
        }

        @media print {
            body { 
                background-color: white; 
                min-height: auto;
                display: block;
            }
            .no-print { display: none !important; }
            .coupon {
                border: none !important; /* Menghilangkan border agar murni desain */
                border-radius: 0 !important;
                box-shadow: none !important;
                margin: 0;
            }
        }

        /* Tampilan di layar */
        .coupon {
            width: 135mm;
            height: 50mm;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            background: white;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            background-color: white;
        }

        .bg-pattern {
            background-image: radial-gradient(#f87171 1px, transparent 1px);
            background-size: 10px 10px;
            opacity: 0.15;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
        }

        .stub {
            width: 32%;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            border-right: 2.5px dashed #475569;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            position: relative;
            z-index: 10;
        }

        .main-ticket {
            width: 68%;
            position: relative;
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            z-index: 10;
            background: white;
        }

        .scissors-icon {
            position: absolute;
            right: -13px;
            top: 15px;
            color: #1e293b;
            background: white;
            border-radius: 50%;
            padding: 2px;
            z-index: 20;
        }
        
        /* Box kosong untuk tempat numerator percetakan */
        .numerator-space {
            width: 100%;
            height: 35px;
            margin: 8px 0;
        }
        .numerator-space-main {
            width: 70px;
            height: 40px;
        }
    </style>
</head>
<body>

    <div class="no-print text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Master Desain Kupon</h1>
        <p class="text-sm text-slate-600 mb-4">Template mentah tanpa angka. Siap diekspor untuk percetakan.</p>
        <button onclick="window.print()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-md shadow-md">
            Simpan sebagai PDF Mentahan
        </button>
    </div>

    <div class="coupon">
        <!-- Bagian Kiri (Undian) -->
        <div class="stub">
            <span class="text-[9px] font-bold uppercase tracking-widest text-red-200">Kupon Undian</span>
            
            <!-- Area Kosong untuk Angka -->
            <div class="bg-white rounded shadow-inner my-2 w-full border-b-4 border-red-200 numerator-space"></div>
            
            <span class="text-[7.5px] text-center font-medium leading-tight">Dipotong oleh<br>panitia</span>

            <svg class="scissors-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m0 5.758a3 3 0 10-4.243 4.243 3 3 0 004.243-4.243zm0-5.758a3 3 0 10-4.243-4.243 3 3 0 004.243 4.243z"></path>
            </svg>
        </div>

        <!-- Bagian Kanan (Peserta) -->
        <div class="main-ticket">
            <div class="bg-pattern"></div>
            <div class="absolute -bottom-8 -right-8 w-32 h-32 bg-red-100 rounded-full opacity-50 z-0"></div>

            <div class="flex flex-col justify-center z-10 w-2/3">
                <div class="flex items-center gap-2 mb-1">
                    <svg class="w-6 h-4 border border-gray-300 shadow-sm" viewBox="0 0 3 2">
                        <rect width="3" height="1" fill="#ef4444"/>
                        <rect y="1" width="3" height="1" fill="#ffffff"/>
                    </svg>
                    <span class="bg-red-700 text-white text-[8px] font-bold px-2 py-0.5 rounded-sm">HUT RI 81</span>
                </div>

                <h2 class="text-lg font-black text-gray-900 uppercase italic leading-none mt-1">
                    Jalan Sehat<br>
                    <span class="text-red-600 text-sm">Kemerdekaan</span>
                </h2>

                <div class="mt-2.5 text-[8.5px] text-gray-700 font-semibold space-y-1">
                    <div class="flex items-center gap-1.5">
                        <svg class="w-3 h-3 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        16 Agustus 2026
                    </div>
                    <div class="flex items-start gap-1.5 leading-tight">
                        <svg class="w-3 h-3 text-red-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span>Windan RT 2/6, Desa Gumpang,<br>Kartasura</span>
                    </div>
                </div>
            </div>

            <!-- Area Kosong untuk Angka Kanan -->
            <div class="flex flex-col justify-center items-end z-10 w-1/3">
                <span class="text-[8px] font-bold text-gray-400 mb-0.5 tracking-widest uppercase">No. Peserta</span>
                <div class="numerator-space-main"></div>
            </div>
        </div>
    </div>

</body>
</html>
