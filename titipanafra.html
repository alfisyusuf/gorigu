<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piring Pintar, Jantung Bugar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ============ 1. DESIGN TOKENS ============ */
:root{
  --ink:#1B2A49; --muted:#5A6785; --paper:#fff; --sky:#EAF3FF; --line:#D5E2F5;
  --heart:#E8365D; --sun:#FFC233;
  /* Warna lampu lalu lintas: dot / latar badge / teks badge */
  --g:#17A87F; --g-bg:#DDF7EE; --g-tx:#0B6B50;
  --y:#F5A800; --y-bg:#FFF1CC; --y-tx:#7A5600;
  --r:#E8365D; --r-bg:#FFE0E6; --r-tx:#A8162F;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink);background:var(--sky);line-height:1.5;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}

/* ============ 2. HERO ============ */
.hero{background:var(--heart);color:#fff;padding:28px 16px 56px;border-radius:0 0 32px 32px;text-align:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,3rem);line-height:1.05}
.hero p{max-width:30em;margin:10px auto 0;font-weight:600}
.ecg{width:100%;max-width:320px;height:48px;margin:14px auto 0;display:block}
.ecg path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.6s ease-out .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ============ 3. PANDUAN LAMPU + FILTER ============ */
.legend{margin:-32px auto 16px;background:var(--paper);border-radius:20px;padding:14px 16px;
  box-shadow:0 6px 20px rgba(27,42,73,.12);display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:.9rem}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend .lg::before{background:var(--g)} .legend .ly::before{background:var(--y)} .legend .lr::before{background:var(--r)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-weight:800;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ============ 4. KARTU MAKANAN (dirender dari data) ============ */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--paper);border-radius:22px;padding:16px 12px 14px;text-align:center;border:2px solid transparent;
  box-shadow:0 3px 0 var(--line);transition:transform .15s,border-color .15s}
.card:active{transform:scale(.96)}
.card:hover{border-color:var(--heart)}
.card .ico{font-size:3rem;line-height:1.1}
.card h3{font-family:var(--display);font-size:1.1rem;line-height:1.15;margin:6px 0 2px}
.card .por{font-size:.78rem;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 8px}
.dot{width:14px;height:14px;border-radius:50%}
.lv-green{--c:var(--g);--bg:var(--g-bg);--tx:var(--g-tx)}
.lv-yellow{--c:var(--y);--bg:var(--y-bg);--tx:var(--y-tx)}
.lv-red{--c:var(--r);--bg:var(--r-bg);--tx:var(--r-tx)}
.dot{background:var(--c)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--tx);font-weight:800;font-size:.78rem}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:24px}

/* ============ 5. BOTTOM SHEET (modal) ============ */
.overlay{position:fixed;inset:0;background:rgba(27,42,73,.55);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:10}
.overlay.open{opacity:1;visibility:visible}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  border-radius:28px 28px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.overlay.open .sheet{transform:none}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:28px;max-height:88vh}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.close{position:absolute;right:14px;top:10px;width:40px;height:40px;border-radius:50%;background:var(--sky);font-size:1.2rem;font-weight:800}
.sheet-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.sheet-head .ico{font-size:3.6rem;line-height:1}
.sheet-head img{width:72px;height:72px;border-radius:18px;object-fit:cover}
.sheet-head h2{font-family:var(--display);font-size:1.6rem;line-height:1.1}
.sheet-head p{color:var(--muted);font-size:.85rem}
h4{font-family:var(--display);font-size:1.15rem;margin:18px 0 8px}

/* Skor jantung: cincin conic-gradient */
.score{display:flex;gap:16px;align-items:center;background:var(--bg);border-radius:20px;padding:14px}
.ring{--p:0;flex:none;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.7) 0)}
.ring b{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;color:var(--tx)}
.score strong{font-family:var(--display);font-size:1.2rem;color:var(--tx);display:block;line-height:1.2}
.score small{color:var(--tx);font-weight:600}

/* Baris rapor per nutrisi */
.row{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.row-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.bar{height:10px;border-radius:5px;background:var(--sky);margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:5px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.row p{font-size:.9rem}
.row small{color:var(--muted)}

/* Tabel nutrisi */
.nut{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.nut div{background:var(--sky);border-radius:14px;padding:8px 12px;display:flex;justify-content:space-between;font-weight:700;font-size:.92rem}
.nut span{color:var(--muted);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags li{list-style:none;background:var(--sky);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.88rem}
.tip{background:var(--sun);border-radius:16px;padding:12px 14px;font-weight:700;margin-top:14px}
.note{font-size:.75rem;color:var(--muted);margin-top:14px}
.plate{margin-top:28px;background:var(--paper);border-radius:22px;padding:16px;font-weight:600}
.plate b{font-family:var(--display);font-size:1.15rem;display:block}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .ecg path{stroke-dashoffset:0}
}
</style>
</head>
<body>

<header class="hero">
  <h1>Piring Pintar,<br>Jantung Bugar</h1>
  <p>Ketuk makanan favoritmu dan lihat rapor jantungnya!</p>
  <svg class="ecg" viewBox="0 0 320 48" aria-hidden="true"><path d="M0 28H90l12-20 14 38 12-30 8 12H320"/></svg>
</header>

<main class="wrap">
  <div class="legend" aria-label="Arti warna lampu">
    <span class="lg">Hijau: aman</span><span class="ly">Kuning: hati-hati</span><span class="lr">Merah: batasi</span>
  </div>
  <div class="filters" id="filters"></div>
  <section class="grid" id="grid" aria-live="polite"></section>

  <aside class="plate">
    <b>Ingat Isi Piringku</b>
    Isi separuh piringmu dengan sayur dan buah, sisanya makanan pokok dan lauk. Camilan kekinian cukup jadi teman sesekali.
  </aside>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet" style="position:relative"></div>
</div>

<script>
/* =====================================================================
   A. DATA MAKANAN  — CUKUP EDIT / TAMBAH OBJEK DI BAWAH INI
   ---------------------------------------------------------------------
   Satuan: kalori (kkal), carbs/fat/satFat/sugar/protein/fiber (gram),
   sodium (mg), semua per 1 porsi yang ditulis di "portion".
   PENTING: angka di bawah adalah PERKIRAAN CONTOH. Ganti dengan data
   resmi (label kemasan / TKPI Kemenkes) sebelum lomba.
   Untuk foto asli: isi "image" dengan URL gambar (opsional). Jika kosong,
   emoji pada "icon" yang dipakai.
   ===================================================================== */
const FOODS = [
  { id:'dubai-cookie', name:'Dubai Chewy Cookie', icon:'🍪', image:'',
    portion:'1 buah (±80 g)',
    nutrition:{ calories:380, carbs:48, fat:19, satFat:9, sugar:30, sodium:150, protein:6, fiber:2 },
    components:['Tepung terigu','Gula','Mentega','Pasta pistachio','Kataifi (mi renyah)','Cokelat'],
    tip:'Bagi dua dengan teman, lalu pasangkan dengan buah segar.' },

  { id:'salad-roll', name:'Salad Roll', icon:'🥗', image:'',
    portion:'2 gulung (±150 g)',
    nutrition:{ calories:180, carbs:24, fat:6, satFat:1, sugar:5, sodium:280, protein:7, fiber:4 },
    components:['Kulit rice paper','Sayuran segar','Telur / ayam / udang','Saus kacang'],
    tip:'Pilihan bagus! Minta saus dipisah dan celup secukupnya saja.' },

  { id:'salt-bread', name:'Salt Bread', icon:'🥐', image:'',
    portion:'1 buah (±70 g)',
    nutrition:{ calories:230, carbs:32, fat:9, satFat:5, sugar:3, sodium:420, protein:6, fiber:1 },
    components:['Tepung terigu','Mentega','Garam flake','Ragi'],
    tip:'Cukup 1 buah, dan temani dengan air putih, bukan minuman manis.' },

  { id:'seblak', name:'Seblak', icon:'🍜', image:'',
    portion:'1 mangkuk (±300 g)',
    nutrition:{ calories:480, carbs:50, fat:24, satFat:8, sugar:4, sodium:1700, protein:14, fiber:3 },
    components:['Kerupuk basah','Bumbu kencur & cabai','Telur / sosis','Sayur (sawi)','Minyak'],
    tip:'Kurangi bumbu & kuah, tambah sayur, dan jangan habiskan kuahnya.' }
  // Contoh makanan ke-5, salin lalu ubah:
  // { id:'...', name:'...', icon:'🍟', image:'', portion:'...', nutrition:{...}, components:[...], tip:'...' },
];

/* =====================================================================
   B. ATURAN LAMPU LALU LINTAS  (edit ambang batas di sini)
   dir:'low'  → makin kecil makin baik (hijau jika <= good, kuning jika <= warn)
   dir:'high' → makin besar makin baik (hijau jika >= good, kuning jika >= warn)
   daily: batas acuan harian (diet ±2000 kkal) untuk bilah persentase
   ===================================================================== */
const RULES = {
  sodium:{ label:'Natrium (garam)', unit:'mg', dir:'low',  good:200, warn:600, daily:2000,
    words:{green:'Rendah',yellow:'Sedang',red:'Tinggi'},
    msg:{ green:'Garamnya rendah. Tekanan darahmu aman!',
          yellow:'Garamnya lumayan. Jangan ditambah kecap atau saus lagi ya.',
          red:'Natrium tinggi! Garam berlebih bikin tubuh menahan air, tekanan darah naik, dan jantung bekerja lebih keras.' }},
  sugar:{ label:'Gula', unit:'g', dir:'low', good:5, warn:15, daily:50,
    words:{green:'Rendah',yellow:'Sedang',red:'Tinggi'},
    msg:{ green:'Gulanya sedikit. Bagus untuk jantung dan gigi!',
          yellow:'Gulanya sedang. Hindari menambah minuman manis.',
          red:'Gula tinggi! Gula berlebih bisa naikkan berat badan dan lemak darah, yang membebani jantung.' }},
  satFat:{ label:'Lemak jenuh', unit:'g', dir:'low', good:3, warn:5, daily:20,
    words:{green:'Rendah',yellow:'Sedang',red:'Tinggi'},
    msg:{ green:'Lemak jenuhnya rendah, pembuluh darah lega.',
          yellow:'Lemak jenuh sedang. Cukup sesekali saja.',
          red:'Lemak jenuh tinggi! Bisa menumpuk jadi kolesterol jahat yang menyempitkan pembuluh darah.' }},
  fiber:{ label:'Serat', unit:'g', dir:'high', good:4, warn:2, daily:25,
    words:{green:'Cukup',yellow:'Lumayan',red:'Kurang'},
    msg:{ green:'Seratnya cukup. Serat membantu menurunkan kolesterol!',
          yellow:'Serat lumayan. Tambah sayur atau buah biar makin juara.',
          red:'Seratnya kurang. Yuk tambah sayur dan buah di piringmu.' }}
};
const RULE_ORDER = ['sodium','sugar','satFat','fiber'];

/* Info nutrisi lain (tanpa lampu), ditampilkan di tabel */
const BASIC = [
  ['calories','Kalori','kkal'],['carbs','Karbohidrat','g'],['fat','Lemak total','g'],
  ['satFat','Lemak jenuh','g'],['sugar','Gula','g'],['sodium','Natrium','mg'],
  ['protein','Protein','g'],['fiber','Serat','g']
];

/* Skor: mulai 100, kurangi penalti, tambah bonus serat */
const SCORE = { penalty:{green:0,yellow:15,red:35}, fiberBonus:5 };
const VERDICT = [
  { min:75, level:'green',  title:'Sahabat jantung',        text:'Boleh sering, tetap atur porsi.' },
  { min:50, level:'yellow', title:'Boleh, tapi hati-hati',  text:'Nikmati sesekali dan seimbangkan dengan sayur.' },
  { min:0,  level:'red',    title:'Sesekali saja',          text:'Enak, tapi jangan jadi kebiasaan harian.' }
];

/* =====================================================================
   C. FUNGSI PEMBANTU
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function levelOf(key, value){
  const r = RULES[key];
  if (r.dir === 'low')  return value <= r.good ? 'green' : value <= r.warn ? 'yellow' : 'red';
  return value >= r.good ? 'green' : value >= r.warn ? 'yellow' : 'red';
}
function analyze(food){
  const levels = {}; let score = 100;
  RULE_ORDER.forEach(k => {
    levels[k] = levelOf(k, food.nutrition[k]);
    if (k === 'fiber') { if (levels[k] === 'green') score += SCORE.fiberBonus; }
    else score -= SCORE.penalty[levels[k]];
  });
  score = Math.max(0, Math.min(100, score));
  const verdict = VERDICT.find(v => score >= v.min);
  return { levels, score, verdict };
}
const visual = f => f.image
  ? `<img src="${esc(f.image)}" alt="Foto ${esc(f.name)}" loading="lazy">`
  : `<div class="ico" aria-hidden="true">${esc(f.icon)}</div>`;

/* =====================================================================
   D. RENDER KARTU (otomatis dari FOODS)
   ===================================================================== */
let activeFilter = 'all';
const FILTERS = [['all','Semua'],['green','💚 Aman'],['yellow','💛 Hati-hati'],['red','❤️ Batasi']];

function renderFilters(){
  $('filters').innerHTML = FILTERS.map(([k,l]) =>
    `<button class="chip" data-f="${k}" aria-pressed="${k===activeFilter}">${l}</button>`).join('');
}
function renderGrid(){
  const list = FOODS.filter(f => activeFilter === 'all' || analyze(f).verdict.level === activeFilter);
  $('grid').innerHTML = list.length ? list.map(f => {
    const a = analyze(f);
    const dots = ['sodium','sugar','satFat'].map(k =>
      `<span class="dot lv-${a.levels[k]}" title="${esc(RULES[k].label)}: ${RULES[k].words[a.levels[k]]}"></span>`).join('');
    return `<button class="card" data-id="${esc(f.id)}" aria-label="Lihat rapor jantung ${esc(f.name)}">
      <div class="ico" aria-hidden="true">${esc(f.icon)}</div>
      <h3>${esc(f.name)}</h3><div class="por">${esc(f.portion)}</div>
      <div class="dots" aria-hidden="true">${dots}</div>
      <span class="pill lv-${a.verdict.level}">${a.verdict.title}</span></button>`;
  }).join('') : '<p class="empty">Belum ada makanan di kategori ini.</p>';
}

/* =====================================================================
   E. RENDER POP-UP DETAIL (bottom sheet)
   ===================================================================== */
let lastFocus = null;
function openSheet(id){
  const f = FOODS.find(x => x.id === id); if (!f) return;
  const a = analyze(f), n = f.nutrition;

  const rows = RULE_ORDER.map(k => {
    const r = RULES[k], lv = a.levels[k], pct = Math.min(100, Math.round(n[k] / r.daily * 100));
    const note = r.dir === 'low' ? `${pct}% dari batas harian (±${r.daily} ${r.unit})` : `${pct}% dari kebutuhan harian (±${r.daily} ${r.unit})`;
    return `<div class="row lv-${lv}">
      <div class="row-top"><span>${r.label}: ${n[k]} ${r.unit}</span><span class="pill">${r.words[lv]}</span></div>
      <div class="bar"><i data-w="${pct}"></i></div>
      <p>${r.msg[lv]}</p><small>${note}</small></div>`;
  }).join('');

  $('sheet').innerHTML = `
    <div class="grab"></div>
    <button class="close" id="closeBtn" aria-label="Tutup">✕</button>
    <div class="sheet-head">${visual(f)}<div><h2 id="sheetTitle">${esc(f.name)}</h2><p>Per porsi: ${esc(f.portion)}</p></div></div>

    <div class="score lv-${a.verdict.level}">
      <div class="ring" id="ring"><b id="scoreNum">0</b></div>
      <div><strong>${a.verdict.title}</strong><small>Skor jantung dari 100. ${a.verdict.text}</small></div>
    </div>

    <h4>Rapor Jantung</h4>${rows}
    <h4>Profil Nutrisi</h4>
    <div class="nut">${BASIC.map(([k,l,u]) => `<div><span>${l}</span>${n[k]} ${u}</div>`).join('')}</div>
    <h4>Komponen Utama</h4>
    <ul class="tags">${f.components.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    <div class="tip">💡 ${esc(f.tip)}</div>
    <p class="note">Angka adalah perkiraan per porsi, acuan diet ±2000 kkal. Kebutuhan anak dan remaja bisa berbeda. Tanyakan ke dokter atau ahli gizi untuk saran pribadi.</p>`;

  lastFocus = document.activeElement;
  $('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('sheet').scrollTop = 0;
  $('closeBtn').focus({preventScroll:true});

  /* Animasi: bilah terisi + skor naik (dilewati bila reduced motion) */
  const ring = $('ring'), num = $('scoreNum');
  const setScore = v => { ring.style.setProperty('--p', v); num.textContent = Math.round(v); };
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll('.bar i').forEach(b => b.style.width = b.dataset.w + '%')));
  if (reduceMotion) { setScore(a.score); return; }
  const t0 = performance.now(), dur = 900;
  (function tick(t){
    const p = Math.min(1, (t - t0) / dur);
    setScore(a.score * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}
function closeSheet(){
  $('overlay').classList.remove('open');
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus({preventScroll:true});
}

/* =====================================================================
   F. EVENT & INISIALISASI
   ===================================================================== */
$('grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openSheet(c.dataset.id); });
$('filters').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  activeFilter = b.dataset.f; renderFilters(); renderGrid();
});
$('overlay').addEventListener('click', e => { if (e.target === $('overlay') || e.target.id === 'closeBtn') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

renderFilters();
renderGrid();
</script>
</body>
</html>
