<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian PSTS - Fisika</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { brand: '#3b82f6', darkbg: '#0f172a', panel: '#1e293b' } }
            }
        }
    </script>
    <style>
        /* Custom scrollbar & styling SVG fisika */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .math-tex { font-family: 'Times New Roman', serif; font-size: 1.1em; }
    </style>
</head>
<body class="bg-darkbg text-slate-300 font-sans antialiased min-h-screen flex flex-col items-center justify-center">

    <!-- Screen Login -->
    <div id="loginScreen" class="w-full max-w-md bg-panel p-8 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-bold text-white mb-2 tracking-tight">PSTS Portal</h1>
        <p class="text-slate-400 mb-6 text-sm">Masuk untuk memulai Penilaian Sumatif Fisika.</p>
        
        <input type="text" id="nis" placeholder="Nomor Induk Siswa" class="w-full bg-slate-800 border border-slate-600 text-white px-4 py-3 rounded-lg mb-4 focus:outline-none focus:border-brand transition">
        <input type="password" id="pin" placeholder="PIN Ujian" class="w-full bg-slate-800 border border-slate-600 text-white px-4 py-3 rounded-lg mb-6 focus:outline-none focus:border-brand transition">
        
        <button onclick="login()" id="btnLogin" class="w-full bg-brand hover:bg-blue-600 text-white font-semibold py-3 rounded-lg transition duration-200">
            Mulai Ujian
        </button>
        <p id="loginMsg" class="text-red-400 text-sm mt-4 hidden"></p>
    </div>

    <!-- Screen Ujian (Hidden by default) -->
    <div id="examScreen" class="hidden w-full max-w-4xl p-6">
        <div class="flex justify-between items-center bg-panel p-4 rounded-xl border border-slate-700 mb-6 sticky top-4 z-10 shadow-lg">
            <div>
                <h2 class="text-white font-bold" id="namaSiswa">Nama Siswa</h2>
                <p class="text-xs text-slate-400" id="kelasSiswa">Kelas</p>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-400 uppercase tracking-wider">Sisa Waktu</span>
                <div id="timer" class="text-2xl font-mono text-brand font-bold">110:00</div>
            </div>
        </div>

        <div id="soalContainer" class="bg-panel p-8 rounded-xl border border-slate-700 mb-6 shadow-md">
            <!-- Soal akan dirender di sini via JS -->
        </div>

        <div class="flex justify-between">
            <button class="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition" onclick="prevSoal()">← Sebelumnya</button>
            <button class="px-6 py-2 bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg transition shadow-[0_0_15px_rgba(22,163,74,0.4)]" onclick="submitUjian()">Submit Jawaban</button>
            <button class="px-6 py-2 bg-brand hover:bg-blue-600 text-white rounded-lg transition" onclick="nextSoal()">Selanjutnya →</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwTqIJgXqqinXBY-_CqsXLWeYSGoO1QxHCacGNPdJ1cBjRiWNUGrrbMH6Ux-53UUhZw/exec';
        let state = { soal: [], user: null, indexAktif: 0, jawaban: {} };

        // Auto load state dari LocalStorage jika web tertutup (fitur resume)
        if(localStorage.getItem('psts_state')) {
            state = JSON.parse(localStorage.getItem('psts_state'));
            if(state.user) renderExam();
        }

        async function login() {
            const nis = document.getElementById('nis').value;
            const pin = document.getElementById('pin').value;
            const btn = document.getElementById('btnLogin');
            const msg = document.getElementById('loginMsg');
            
            btn.innerText = 'Memeriksa...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}?nis=${nis}&pin=${pin}`);
                const data = await res.json();

                if(data.status === 'success') {
                    state.user = data.user;
                    state.soal = data.soal;
                    saveState();
                    renderExam();
                } else {
                    msg.innerText = data.message;
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.innerText = 'Gagal terhubung ke server.';
                msg.classList.remove('hidden');
            }
            btn.innerText = 'Mulai Ujian';
            btn.disabled = false;
        }

        function renderExam() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('examScreen').classList.remove('hidden');
            document.getElementById('namaSiswa').innerText = state.user.nama;
            document.getElementById('kelasSiswa').innerText = state.user.kelas;
            
            tampilkanSoal(state.indexAktif);
        }

        function tampilkanSoal(idx) {
            const kontainer = document.getElementById('soalContainer');
            const soal = state.soal[idx];
            
            // Format render HTML menyesuaikan tipe soal (MCQ, MCMA, TF)
            let html = `
                <div class="mb-4 flex items-center justify-between">
                    <span class="bg-slate-800 text-slate-300 px-3 py-1 rounded-md text-sm font-semibold border border-slate-600">Soal ${idx + 1} / ${state.soal.length}</span>
                    <span class="text-xs text-brand border border-brand/30 bg-brand/10 px-2 py-1 rounded">${soal.tipe}</span>
                </div>
                <div class="text-lg leading-relaxed mb-6 math-tex">${soal.pertanyaan}</div>
                <div class="space-y-3">
            `;

            if(soal.tipe === 'MCQ') {
                ['A', 'B', 'C', 'D', 'E'].forEach(opt => {
                    if(soal.opsi[opt]) {
                        const isChecked = state.jawaban[soal.id] === opt ? 'bg-brand/20 border-brand' : 'border-slate-600 hover:border-slate-400';
                        html += `
                        <div onclick="pilihJawaban('${soal.id}', '${opt}')" 
                             class="p-4 border rounded-lg cursor-pointer transition flex gap-4 items-center ${isChecked}">
                            <div class="w-8 h-8 rounded-full border border-slate-500 flex items-center justify-center font-bold text-sm bg-slate-800">${opt}</div>
                            <div class="math-tex">${soal.opsi[opt]}</div>
                        </div>`;
                    }
                });
            }
            // TODO: Tambahkan render untuk MCMA (checkbox) dan TF_TABLE (radio per baris)

            html += `</div>`;
            kontainer.innerHTML = html;
        }

        function pilihJawaban(idSoal, opsi) {
            state.jawaban[idSoal] = opsi;
            saveState();
            tampilkanSoal(state.indexAktif);
        }

        function nextSoal() {
            if(state.indexAktif < state.soal.length - 1) {
                state.indexAktif++;
                tampilkanSoal(state.indexAktif);
            }
        }

        function prevSoal() {
            if(state.indexAktif > 0) {
                state.indexAktif--;
                tampilkanSoal(state.indexAktif);
            }
        }

        function saveState() {
            localStorage.setItem('psts_state', JSON.stringify(state));
        }

        async function submitUjian() {
            if(!confirm('Yakin ingin mengumpulkan ujian? Anda tidak bisa kembali setelah ini.')) return;
            
            // POST data via fetch
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    nis: state.user.nis,
                    nama: state.user.nama,
                    kelas: state.user.kelas,
                    jawaban: state.jawaban
                })
            });
            
            localStorage.removeItem('psts_state');
            alert('Ujian berhasil dikumpulkan. Skor telah terekam di sistem.');
            location.reload();
        }
    </script>
</body>
</html>
