<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majmu'atul Rasail - Risalah Ta'alim</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js untuk State Management (Toggle & Fetching) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Tipografi Arab dan Latin -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-arabic { 
            font-family: 'Amiri', serif; 
            line-height: 2.4; 
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased" x-data="documentData()">

    <!-- Header & Navigasi -->
    <header class="glass-header fixed top-0 w-full z-50 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-lg font-semibold tracking-tight text-slate-900">Risalah Ta'alim</h1>
            <div class="flex gap-2">
                <button @click="toggleAll()" 
                        class="px-4 py-2 text-sm font-medium text-white bg-slate-800 rounded-lg hover:bg-slate-700 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-1">
                    <span x-text="showAll ? 'Sembunyikan Arti' : 'Tampilkan Arti'"></span>
                </button>
                <!-- Tombol Refresh Data (Serverless Handling Concept) -->
                <button @click="refreshData()" 
                        class="p-2 text-slate-600 bg-slate-200 rounded-lg hover:bg-slate-300 transition-colors focus:outline-none" title="Muat Ulang Data">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-3xl mx-auto px-4 pt-24 pb-12">
        
        <!-- Indikator Loading -->
        <div x-show="loading" class="flex justify-center py-10">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-slate-900"></div>
        </div>

        <!-- Pesan Error -->
        <div x-show="error" class="bg-red-50 text-red-600 p-4 rounded-lg text-center font-medium" x-text="error"></div>

        <!-- Render Data JSON -->
        <div class="space-y-6" x-show="!loading && !error">
            <template x-for="(item, index) in content" :key="index">
                <article class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden transition-all duration-200 hover:shadow-md">
                    <!-- Teks Arab Berharakat -->
                    <div class="p-6 text-right">
                        <p class="font-arabic text-3xl md:text-4xl text-slate-900 leading-relaxed" dir="rtl" x-text="item.arabic"></p>
                    </div>
                    
                    <!-- Terjemahan (Toggleable) -->
                    <div x-show="showAll" 
                         x-collapse 
                         class="border-t border-slate-50 bg-slate-50/50">
                        <div class="p-6">
                            <p class="text-base text-slate-600 leading-relaxed" x-text="item.translation"></p>
                        </div>
                    </div>
                </article>
            </template>
        </div>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('documentData', () => ({
                showAll: true,
                content: [],
                loading: true,
                error: null,
                
                async init() {
                    await this.loadData();
                },
                
                toggleAll() {
                    this.showAll = !this.showAll;
                },

                async refreshData() {
                    this.loading = true;
                    this.error = null;
                    this.content = [];
                    // Efek transisi jaringan
                    setTimeout(async () => {
                        await this.loadData();
                    }, 400);
                },

                async loadData() {
                    try {
                        const response = await fetch('data.json');
                        if (!response.ok) throw new Error('Gagal memuat file data.json. Pastikan dijalankan melalui local server (bukan file://).');
                        this.content = await response.json();
                    } catch (err) {
                        this.error = err.message;
                    } finally {
                        this.loading = false;
                    }
                }
            }));
        });
    </script>
</body>
</html>
