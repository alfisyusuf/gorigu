<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review PSTS Fisika - Elektrostatika</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },
  svg: { fontCache: 'global' }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --border: #e2e8f0;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --primary: #2563eb;
    --primary-soft: #eff6ff;
    --accent: #f59e0b;
    --accent-soft: #fef3c7;
    --correct: #16a34a;
    --correct-soft: #dcfce7;
    --wrong: #ef4444;
    --wrong-soft: #fee2e2;
    --radius-lg: 12px;
    --radius-md: 8px;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Topbar */
  #topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--shadow-sm);
  }
  .brand h2 { margin: 0; font-size: 16px; font-weight: 700; color: var(--text-main); }
  .brand span { font-size: 13px; color: var(--text-muted); }
  .controls { display: flex; gap: 12px; align-items: center; }
  .stat { font-size: 13px; color: var(--text-muted); text-align: right; display: none; }
  @media (min-width: 600px) { .stat { display: block; } }
  .stat b { color: var(--text-main); font-size: 14px; display: block; }
  
  button {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: var(--radius-md); cursor: pointer;
    transition: all 0.2s; border: 1px solid var(--border); background: var(--bg-card);
  }
  button:hover { background: var(--bg-page); }
  button.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* Layout */
  #wrap { max-width: 800px; margin: 0 auto; padding: 40px 20px 100px; }
  
  .header-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px; margin-bottom: 32px;
    box-shadow: var(--shadow-sm);
  }
  .header-card h1 { margin: 0 0 8px; font-size: 24px; font-weight: 700; }
  .header-card .sub { color: var(--text-muted); font-size: 15px; margin-bottom: 16px; }
  .meta-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px;
    padding-top: 16px; border-top: 1px solid var(--border);
  }
  .meta-item { font-size: 12px; color: var(--text-muted); }
  .meta-item b { display: block; font-size: 14px; color: var(--text-main); margin-top: 2px; }

  h2.section-title {
    font-size: 18px; font-weight: 600; margin: 0 0 16px; color: var(--text-main);
    display: flex; align-items: center; gap: 12px;
  }
  h2.section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* Tables */
  .table-wrap {
    overflow-x: auto; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); margin-bottom: 32px; box-shadow: var(--shadow-sm);
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--bg-page); font-weight: 600; color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
  tr:last-child td { border-bottom: none; }
  td.num { font-family: 'JetBrains Mono', monospace; color: var(--text-muted); }

  /* Questions */
  .qcard {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px;
    box-shadow: var(--shadow-sm); border-left: 4px solid var(--border);
  }
  .qcard.type-MCQ { border-left-color: var(--text-main); }
  .qcard.type-MCMA { border-left-color: var(--primary); }
  .qcard.type-TF_TABLE { border-left-color: var(--accent); }

  .qhead { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .qnum { font-weight: 700; font-size: 16px; color: var(--text-main); }
  .badge {
    font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .badge.MCQ { background: var(--bg-page); color: var(--text-muted); }
  .badge.MCMA { background: var(--primary-soft); color: var(--primary); }
  .badge.TF_TABLE { background: var(--accent-soft); color: var(--accent); }
  .qmeta { margin-left: auto; font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

  .stem { font-size: 16px; margin-bottom: 20px; }
  
  .stimulus {
    background: var(--accent-soft); padding: 16px; border-radius: var(--radius-md);
    margin-bottom: 20px; font-size: 15px; color: #78350f; border: 1px solid #fcd34d;
  }
  .stimulus p { margin: 0 0 10px; }
  .stimulus p:last-child { margin: 0; }

  ol.opts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  ol.opts li {
    display: flex; gap: 12px; padding: 12px 16px; border: 1px solid var(--border);
    border-radius: var(--radius-md); font-size: 15px; align-items: flex-start;
    background: var(--bg-card); transition: all 0.2s;
  }
  ol.opts li .tag {
    font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px;
    color: var(--text-muted); border: 1px solid var(--border); border-radius: 50%;
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; background: var(--bg-page);
  }
  ol.opts.MCMA li .tag { border-radius: 4px; }

  /* SHOW KEY STYLES */
  body.show-key ol.opts li.correct {
    background: var(--correct-soft); border-color: var(--correct);
  }
  body.show-key ol.opts li.correct .tag {
    background: var(--correct); color: white; border-color: var(--correct);
  }

  table.tf { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
  table.tf th, table.tf td { padding: 12px 16px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
  table.tf th:last-child, table.tf td:last-child { border-right: none; }
  table.tf tr:last-child td { border-bottom: none; }
  table.tf th { background: var(--bg-page); font-weight: 600; font-size: 12px; }
  table.tf td.tfv { text-align: center; font-weight: 700; width: 60px; color: var(--border); font-family: 'JetBrains Mono', monospace; }
  
  body.show-key table.tf td.tfv.T { background: var(--correct-soft); color: var(--correct); }
  body.show-key table.tf td.tfv.F { background: var(--wrong-soft); color: var(--wrong); }

  .keyline {
    display: none; margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--correct); font-weight: 600;
  }
  body.show-key .keyline { display: block; }
  .instruction-text { font-size: 13px; color: var(--primary); margin-bottom: 12px; font-weight: 500; }

  @media print {
    #topbar { display: none; }
    body { background: white; }
    #wrap { padding: 0; max-width: 100%; }
    .qcard { break-inside: avoid; border: 1px solid #000; box-shadow: none; border-left-width: 1px; }
    .header-card, .table-wrap { border: 1px solid #000; box-shadow: none; }
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">
    <h2 id="tb-title">Memuat...</h2>
    <span>Review Kumpulan Soal</span>
  </div>
  <div class="controls">
    <div class="stat">Jumlah: <b id="stat-jumlah">-</b></div>
    <div class="stat">Durasi: <b id="stat-durasi">-</b></div>
    <button id="btn-key">Tampilkan Kunci</button>
    <button onclick="window.print()">Cetak PDF</button>
  </div>
</div>

<div id="wrap">
  <div id="loading" style="text-align:center; padding: 40px; color:#64748b;">
    Memuat data dari soal.json...
  </div>
  <div id="content" style="display:none;">
    
    <div class="header-card">
      <h1 id="doc-title">Title</h1>
      <div class="sub" id="doc-sub">Subtitle</div>
      <div class="meta-grid" id="doc-meta"></div>
    </div>

    <h2 class="section-title">Instruksi Pengerjaan</h2>
    <div class="header-card" style="padding: 16px 24px;">
      <ul id="instruksi-list" style="margin: 0; padding-left: 20px; color: var(--text-muted); font-size: 14.5px;"></ul>
    </div>

    <h2 class="section-title">Kisi-Kisi Soal</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width: 40px;">No</th>
            <th>Sub Materi & Indikator</th>
            <th style="width: 80px;">Level</th>
            <th style="width: 100px;">Soal</th>
          </tr>
        </thead>
        <tbody id="kisi-body"></tbody>
      </table>
    </div>

    <h2 class="section-title">Naskah Soal</h2>
    <div id="soal-list"></div>
    
  </div>
</div>

<script>
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

fetch('soal.json?t=' + new Date().getTime())
  .then(res => {
    if(!res.ok) throw new Error("Gagal memuat JSON");
    return res.json();
  })
  .then(data => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    renderApp(data);
  })
  .catch(err => {
    document.getElementById('loading').innerHTML = `<b>Error:</b> Tidak dapat menemukan <code>soal.json</code>. <br><br>Pastikan Anda membuka file HTML ini menggunakan Local Web Server (misal: Live Server di VS Code) dan file JSON berada di folder yang sama.`;
    console.error(err);
  });

function renderApp(DATA) {
  // Header
  document.getElementById('tb-title').textContent = DATA.metadata.materi;
  document.getElementById('doc-title').textContent = DATA.metadata.title;
  document.getElementById('doc-sub').textContent = DATA.metadata.judul + " · " + DATA.metadata.jenjang;
  document.getElementById('stat-durasi').textContent = DATA.metadata.durasi_menit + " menit";
  document.getElementById('stat-jumlah').textContent = DATA.metadata.jumlah_soal + " soal";

  const metaGrid = document.getElementById('doc-meta');
  DATA.metadata.komposisi.forEach(k => {
    metaGrid.appendChild(el('div', 'meta-item', `${k.bentuk}<b>${k.jumlah} Soal</b>`));
  });
  metaGrid.appendChild(el('div', 'meta-item', `Skor Maksimal<b>${DATA.metadata.skor_maksimum}</b>`));

  // Instruksi
  const instrList = document.getElementById('instruksi-list');
  DATA.metadata.instruksi.forEach(i => instrList.appendChild(el('li', null, i)));
  instrList.appendChild(el('li', null, `<i>Catatan Math: ${DATA.metadata.catatan_matematika}</i>`));

  // Kisi-Kisi
  const kisiBody = document.getElementById('kisi-body');
  DATA.kisi_kisi.forEach(row => {
    const tr = el('tr');
    tr.appendChild(el('td', 'num', row.no));
    tr.appendChild(el('td', null, `<b>${row.sub_materi}</b><br><span style="font-size:13px; color:#64748b;">${row.indikator}</span>`));
    tr.appendChild(el('td', 'num', row.level_kognitif));
    tr.appendChild(el('td', 'num', `No. ${row.nomor_soal}`));
    kisiBody.appendChild(tr);
  });

  // Soal
  const soalList = document.getElementById('soal-list');
  DATA.soal.forEach(q => {
    if(q.tipe === 'MCQ') soalList.appendChild(renderMCQ(q));
    else if(q.tipe === 'MCMA') soalList.appendChild(renderMCMA(q));
    else if(q.tipe === 'TF_TABLE') soalList.appendChild(renderTF(q));
  });

  // Re-render MathJax
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise();
  }
}

function renderMCQ(q){
  const card = el('div', `qcard type-${q.tipe}`);
  const head = el('div', 'qhead');
  head.appendChild(el('span', 'qnum', q.no + '.'));
  head.appendChild(el('span', 'badge MCQ', 'MCQ'));
  head.appendChild(el('span', 'qmeta', `${q.sub_materi} | Lvl: ${q.level_kognitif} | ${q.bobot} pt`));
  card.appendChild(head);
  card.appendChild(el('div', 'stem', q.pertanyaan));
  
  const ol = el('ol', 'opts');
  Object.keys(q.opsi).forEach(k => {
    const li = el('li', k === q.kunci ? 'correct' : '');
    li.appendChild(el('span', 'tag', k));
    li.appendChild(el('div', null, q.opsi[k]));
    ol.appendChild(li);
  });
  card.appendChild(ol);
  card.appendChild(el('div', 'keyline', 'Kunci Jawaban: ' + q.kunci));
  return card;
}

function renderMCMA(q){
  const card = el('div', `qcard type-${q.tipe}`);
  const head = el('div', 'qhead');
  head.appendChild(el('span', 'qnum', q.no + '.'));
  head.appendChild(el('span', 'badge MCMA', 'MCMA'));
  head.appendChild(el('span', 'qmeta', `${q.sub_materi} | Lvl: ${q.level_kognitif} | ${q.bobot} pt`));
  card.appendChild(head);
  card.appendChild(el('div', 'stem', q.pertanyaan));
  card.appendChild(el('div', 'instruction-text', `Pilih tepat ${q.jumlah_pilihan_benar} jawaban benar.`));
  
  const correctSet = q.kunci.split(',').map(s => s.trim());
  const ol = el('ol', 'opts MCMA');
  Object.keys(q.opsi).forEach(k => {
    const isCorrect = correctSet.includes(k);
    const li = el('li', isCorrect ? 'correct' : '');
    li.appendChild(el('span', 'tag', k));
    li.appendChild(el('div', null, q.opsi[k]));
    ol.appendChild(li);
  });
  card.appendChild(ol);
  card.appendChild(el('div', 'keyline', 'Kunci Jawaban: ' + q.kunci));
  return card;
}

function renderTF(q){
  const card = el('div', `qcard type-${q.tipe}`);
  const head = el('div', 'qhead');
  head.appendChild(el('span', 'qnum', q.no + '.'));
  head.appendChild(el('span', 'badge TF_TABLE', 'True / False'));
  head.appendChild(el('span', 'qmeta', `${q.sub_materi} | Lvl: ${q.level_kognitif} | ${q.bobot} pt`));
  card.appendChild(head);
  card.appendChild(el('div', 'stimulus', '<p>' + q.stimulus.replaceAll('<br><br>', '</p><p>') + '</p>'));
  
  const table = el('table', 'tf');
  table.appendChild(el('thead', null, '<tr><th>Pernyataan</th><th style="text-align:center">Benar (T)</th><th style="text-align:center">Salah (F)</th></tr>'));
  const tbody = el('tbody');
  
  q.pernyataan.forEach(p => {
    const tr = el('tr');
    tr.appendChild(el('td', null, p.text));
    const ans = q.kunci[p.id];
    tr.appendChild(el('td', 'tfv ' + (ans==='T' ? 'T' : ''), '✓'));
    tr.appendChild(el('td', 'tfv ' + (ans==='F' ? 'F' : ''), '✗'));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  card.appendChild(table);
  
  const keyStr = q.pernyataan.map(p => p.id.slice(-1).toUpperCase() + ':' + q.kunci[p.id]).join(' | ');
  card.appendChild(el('div', 'keyline', 'Kunci Jawaban: ' + keyStr));
  return card;
}

// Key Toggle
const btnKey = document.getElementById('btn-key');
btnKey.addEventListener('click', () => {
  document.body.classList.toggle('show-key');
  const isOn = document.body.classList.contains('show-key');
  btnKey.textContent = isOn ? 'Sembunyikan Kunci' : 'Tampilkan Kunci';
  btnKey.classList.toggle('active', isOn);
});
</script>
</body>
</html>
