      <p><b>Aturan tanda</b> (pilih arah loop dulu, misalnya searah jarum jam ↻):</p>
      <ul>
        <li>🔋 Bertemu <b>garis panjang (+)</b> lebih dulu → \(\varepsilon\) bernilai <b>positif</b>.</li>

        <li>〰️ Arah loop searah arus → \(I \cdot R\) bernilai positif.</li>
      </ul>
      <div class="analogy">🪢 <b>Analogi tarik tambang:</b> Dua baterai yang dipasang berlawanan saling "menarik" arus ke arah berbeda. Yang menang adalah GGL yang lebih besar, dan kekuatan bersihnya adalah <b>selisihnya</b>.</div>
      \[I = \frac{\varepsilon_1 - \varepsilon_2}{R_1 + R_2}\]`,
    l2_question: p => tx`Perhatikan rangkaian satu loop di bawah. Diketahui \(\varepsilon_1 = ${p.E1}\ \text{V}\), \(\varepsilon_2 = ${p.E2}\ \text{V}\), \(R_1 = ${p.R1}\ \Omega\), dan \(R_2 = ${p.R2}\ \Omega\). Kedua baterai dipasang <b>berlawanan arah</b> (lihat kutub + di gambar). Berapa kuat arus dalam rangkaian?`,

    l2_s1_sol: p => tx`\(\varepsilon_{net} = ${p.E1} - ${p.E2} = ${p.En}\ \text{V}\)`,

    l2s1_add: tx`Ups! Kamu menjumlahkan kedua GGL. Karena baterainya <b>berlawanan arah</b> (tarik tambang 🪢), GGL-nya harus <b>dikurangi</b>.`,

    l2s2_sub: tx`Resistor seri itu <b>dijumlahkan</b>, bukan dikurangi. ➕`,
    l2s2_one: tx`Kamu baru memakai satu resistor. Arus melewati \(R_1\) <b>dan</b> \(R_2\)!`,

/* =====================================================================
   2. CIRCUIT DRAWING (inline SVG)
   ===================================================================== */
const WIRE = '#3A2A2A', RES = '#8B1515', RES_IN = '#C0562F', GOLD_D = '#C9800A', PLUS = '#B3261E', MINUS = '#1F4E8C';

const line = (x1, y1, x2, y2) =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${WIRE}" stroke-width="4" stroke-linecap="round"/>`;

const txt = (x, y, s, { size = 15, weight = 700, fill = '#2B1D1D', anchor = 'middle' } = {}) =>
  `<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}">${s}</text>`;

/** Horizontal zig-zag resistor between x1 and x2 */
function resH(x1, x2, y, color = RES) {
  const n = 6, seg = (x2 - x1) / n, amp = 10;
  let d = `M${x1},${y}`;
  for (let k = 0; k < n; k++) d += ` L${x1 + seg * (k + 0.5)},${y + (k % 2 ? amp : -amp)}`;
  d += ` L${x2},${y}`;
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
}
/** Vertical zig-zag resistor between y1 and y2 */
function resV(x, y1, y2, color = RES) {
  const n = 6, seg = (y2 - y1) / n, amp = 10;
  let d = `M${x},${y1}`;
  for (let k = 0; k < n; k++) d += ` L${x + (k % 2 ? amp : -amp)},${y1 + seg * (k + 0.5)}`;
  d += ` L${x},${y2}`;
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
}
/** Vertical battery centred at (x, cy). Plates at cy-8 and cy+8. Long plate = (+). */
function batV(x, cy, plusTop, signDx) {
  const yT = cy - 8, yB = cy + 8;
  const yPlus = plusTop ? yT : yB, yMinus = plusTop ? yB : yT;
  const longP = `<line x1="${x - 22}" y1="${yPlus}" x2="${x + 22}" y2="${yPlus}" stroke="${WIRE}" stroke-width="4" stroke-linecap="round"/>`;
  const shortP = `<line x1="${x - 11}" y1="${yMinus}" x2="${x + 11}" y2="${yMinus}" stroke="${WIRE}" stroke-width="8"/>`;
  const plusLbl = txt(x + signDx, plusTop ? yT - 3 : yB + 14, '+', { size: 18, fill: PLUS, weight: 800 });
  const minusLbl = txt(x + signDx, plusTop ? yB + 14 : yT - 3, '−', { size: 18, fill: MINUS, weight: 800 });
  return longP + shortP + plusLbl + minusLbl;
}
/** Horizontal battery centred at (cx, y). Plates at cx-8 and cx+8. */
function batH(cx, y, plusLeft) {
  const xL = cx - 8, xR = cx + 8;
  const xPlus = plusLeft ? xL : xR, xMinus = plusLeft ? xR : xL;
  return `<line x1="${xPlus}" y1="${y - 22}" x2="${xPlus}" y2="${y + 22}" stroke="${WIRE}" stroke-width="4" stroke-linecap="round"/>` +
         `<line x1="${xMinus}" y1="${y - 11}" x2="${xMinus}" y2="${y + 11}" stroke="${WIRE}" stroke-width="8"/>` +
         txt(xPlus + (plusLeft ? -6 : 6), y - 28, '+', { size: 18, fill: PLUS, weight: 800 }) +
         txt(xMinus + (plusLeft ? 6 : -6), y - 28, '−', { size: 18, fill: MINUS, weight: 800 });
}
const arrowRight = (x, y, c = GOLD_D) => `<polygon points="${x - 8},${y - 8} ${x + 8},${y} ${x - 8},${y + 8}" fill="${c}"/>`;
const svgOpen = (w, h, label) =>
  `<svg viewBox="0 0 ${w} ${h}" class="w-full h-auto max-w-xl mx-auto" role="img" aria-label="${escAttr(label)}" style="font-family:'Plus Jakarta Sans',sans-serif">`;

/* Level 1: battery (with internal r inside dashed box) + external R */
function drawL1(p) {
  const L = 130, Rx = 380, T = 50, B = 220;
  return svgOpen(480, 260, 'Circuit: battery with internal resistance and resistor R') +
    // dashed "real battery" box
    `<rect x="${L - 40}" y="72" width="80" height="120" rx="14" fill="#FFE7BA" fill-opacity="0.45" stroke="${GOLD_D}" stroke-width="2" stroke-dasharray="6 5"/>` +
    txt(L, 66, t('svgBattery'), { size: 12, fill: GOLD_D }) +
    // wires & components
    line(L, T, Rx, T) + arrowRight(255, T) + txt(255, T - 14, 'I', { size: 16, fill: GOLD_D }) +
    line(Rx, T, Rx, 105) + resV(Rx, 105, 165) + line(Rx, 165, Rx, B) +
    line(L, B, Rx, B) +
    line(L, T, L, 92) + batV(L, 100, true, 30) + line(L, 108, L, 135) + resV(L, 135, 175, RES_IN) + line(L, 175, L, B) +
    // labels
    txt(L - 50, 106, `ε = ${p.E} V`, { anchor: 'end' }) +
    txt(L - 50, 160, `r = ${p.r} Ω`, { anchor: 'end', fill: RES_IN }) +
    txt(Rx + 18, 140, `R = ${p.R} Ω`, { anchor: 'start', fill: RES }) +
    '</svg>';
}

/* Level 2: one loop, two opposing batteries (both + on top), R1 top, R2 bottom */
function drawL2(p) {
  const L = 130, Rx = 350, T = 60, B = 230, cy = 145, cx = (L + Rx) / 2;
  return svgOpen(480, 280, 'Single loop circuit with two opposing batteries and two resistors') +
    line(L, T, 200, T) + resH(200, 280, T) + line(280, T, Rx, T) +
    line(L, B, 200, B) + resH(200, 280, B) + line(280, B, Rx, B) +
    line(L, T, L, cy - 8) + batV(L, cy, true, 32) + line(L, cy + 8, L, B) +
    line(Rx, T, Rx, cy - 8) + batV(Rx, cy, true, -32) + line(Rx, cy + 8, Rx, B) +
    // loop direction (clockwise)
    `<path d="M ${cx} ${cy - 32} A 32 32 0 1 1 ${cx - 32} ${cy}" fill="none" stroke="${GOLD_D}" stroke-width="3" stroke-dasharray="5 4"/>` +
    `<polygon points="${cx - 40},${cy + 4} ${cx - 24},${cy + 4} ${cx - 32},${cy - 9}" fill="${GOLD_D}"/>` +
    txt(cx + 2, cy + 5, t('svgLoop') + ' ↻', { size: 11, fill: GOLD_D, weight: 700 }) +
    // labels
    txt(L - 36, cy + 5, `ε₁ = ${p.E1} V`, { anchor: 'end' }) +
    txt(Rx + 36, cy + 5, `ε₂ = ${p.E2} V`, { anchor: 'start' }) +
    txt(240, T - 20, `R₁ = ${p.R1} Ω`, { fill: RES }) +
    txt(240, B + 34, `R₂ = ${p.R2} Ω`, { fill: RES }) +
    '</svg>';
}

/* Level 3: straight path A — R — battery — B */
function drawL3(p) {
  const y = 80;
  return svgOpen(480, 190, 'Wire segment from A to B with a resistor and a battery') +
    line(40, y, 130, y) + arrowRight(85, y) + txt(85, y - 16, `I = ${p.I} A`, { size: 14, fill: GOLD_D }) +
    resH(130, 210, y) + txt(170, y - 22, `R = ${p.R} Ω`, { fill: RES }) +
    line(210, y, 292, y) + batH(300, y, p.plusA) + line(308, y, 440, y) +
    txt(300, y + 46, `ε = ${p.E} V`) +
    `<circle cx="40" cy="${y}" r="8" fill="#8B1515"/><circle cx="440" cy="${y}" r="8" fill="#8B1515"/>` +
    txt(40, y + 32, 'A', { size: 20, fill: '#8B1515', weight: 800 }) +
    txt(440, y + 32, 'B', { size: 20, fill: '#8B1515', weight: 800 }) +
    // walking direction
    `<line x1="70" y1="150" x2="405" y2="150" stroke="${GOLD_D}" stroke-width="3" stroke-dasharray="7 6"/>` +
    arrowRight(410, 150) + txt(240, 176, t('svgWalk'), { size: 13, fill: GOLD_D }) +
    '</svg>';
}

/* =====================================================================
   3. LEVEL DEFINITIONS
   Every generator guarantees integer answers.
   diagnose(v, p) returns an i18n key describing the likely mistake.
   ===================================================================== */
const LEVELS = [
  { // ---------- LEVEL 1 ----------
    gen() {
      const r = rand(1, 3), R = rand(2, 10), I = rand(1, 4), Rt = R + r;
      return { r, R, I, Rt, E: I * Rt };
    },
    draw: drawL1,
    steps: [
      { sym: tx`R_{total}`, unit: 'Ω', answer: p => p.Rt,
        diagnose: (v, p) => v === p.R ? 'l1s1_forgot_r' : v === p.R * p.r ? 'l1s1_mult' : v === p.R - p.r ? 'l1s1_sub' : v === p.E ? 'l1s1_emf' : 'l1s1_generic' },
      { sym: tx`I`, unit: 'A', answer: p => p.I,
        diagnose: (v, p) => (p.E % p.R === 0 && v === p.E / p.R) ? 'l1s2_onlyR' : v === p.E * p.Rt ? 'l1s2_mult'
          : v === p.E ? 'l1s2_emf' : v === p.Rt ? 'l1s2_rt' : 'l1s2_generic' }
    ]
  },
  { // ---------- LEVEL 2 ----------
    gen() {
      const R1 = rand(1, 6), R2 = rand(1, 6), I = rand(1, 3), Rt = R1 + R2, En = I * Rt, E2 = rand(2, 9);
      return { R1, R2, I, Rt, En, E2, E1: E2 + En };
    },
    draw: drawL2,
    steps: [
      { sym: tx`\varepsilon_{net}`, unit: 'V', answer: p => p.En,
        diagnose: (v, p) => v === p.E1 + p.E2 ? 'l2s1_add' : v === p.E2 - p.E1 ? 'l2s1_neg' : (v === p.E1 || v === p.E2) ? 'l2s1_one' : 'l2s1_generic' },
      { sym: tx`R_{total}`, unit: 'Ω', answer: p => p.Rt,
        diagnose: (v, p) => v === p.R1 * p.R2 ? 'l2s2_mult' : v === Math.abs(p.R1 - p.R2) ? 'l2s2_sub' : (v === p.R1 || v === p.R2) ? 'l2s2_one' : 'l2s2_generic' },
      { sym: tx`I`, unit: 'A', answer: p => p.I,
        diagnose: (v, p) => v === -p.I ? 'l2s3_neg' : ((p.E1 + p.E2) % p.Rt === 0 && v === (p.E1 + p.E2) / p.Rt) ? 'l2s3_sum'
          : v === p.En * p.Rt ? 'l2s3_mult' : (p.E1 % p.Rt === 0 && v === p.E1 / p.Rt) ? 'l2s3_onlyE1' : v === p.En ? 'l2s3_en' : 'l2s3_generic' }
    ]
  },
  { // ---------- LEVEL 3 ----------
    gen() {
      let I, R, E, s, VR, VAB;
      do {
        I = rand(1, 4); R = rand(2, 8); E = rand(3, 15); s = Math.random() < 0.5 ? 1 : -1;
        VR = I * R; VAB = VR + s * E;
      } while (VAB === 0 || E === VR); // avoid ambiguous cases
      return { I, R, E, s, plusA: s === 1, VR, VAB };
    },
    draw: drawL3,
    steps: [
      { sym: tx`V_R`, unit: 'V', answer: p => p.VR,
        diagnose: (v, p) => v === p.I + p.R ? 'l3s1_add' : (v === p.I || v === p.R) ? 'l3s1_one' : 'l3s1_generic' },
      { sym: tx`V_{AB}`, unit: 'V', answer: p => p.VAB,
        diagnose: (v, p) => v === p.VR - p.s * p.E ? 'l3s2_sign' : v === -p.VAB ? 'l3s2_reverse' : v === p.VR ? 'l3s2_forgotE'
          : (v === p.E || v === -p.E) ? 'l3s2_forgotIR' : 'l3s2_generic' }
    ]
  }
];
const TOTAL_STEPS = LEVELS.reduce((n, L) => n + L.steps.length, 0);

/* =====================================================================
   4. APP STATE
   ===================================================================== */
function freshLevelState(li) {
  const n = LEVELS[li].steps.length;
  return {
    p: LEVELS[li].gen(),
    solved: Array(n).fill(false),
    values: Array(n).fill(''),
    feedback: Array(n).fill(null),   // {type:'ok'|'err'|'warn', key, i}
    attempts: Array(n).fill(0),
    showHint: Array(n).fill(false),
    showSol: Array(n).fill(false),
    completed: false
  };
}
const state = {
  lang: 'id',
  unlocked: 1,               // how many levels are visible
  levels: LEVELS.map((_, i) => freshLevelState(i)),
  modal: null,               // {kind:'level'|'final', li}
  justUnlocked: null,        // level index to animate
  focus: null,               // input id to focus after render
  shake: null                // input id to shake after render
};

/* t(): translate a key (strings, arrays or functions of params) */
function t(key, p) {
  const v = I18N[state.lang][key] ?? I18N.id[key] ?? key;
  return typeof v === 'function' ? v(p) : v;
}

/* =====================================================================
   5. MATHJAX HELPERS (queued so renders never overlap)
   ===================================================================== */
const App = window.App = {
  mathReady: false,
  typesetAll() { typeset(document.getElementById('app-main')); typeset(document.getElementById('modal')); }
};
let mjChain = Promise.resolve();
function typeset(el) {
  if (!App.mathReady || !el) return;
  mjChain = mjChain.then(() => MathJax.typesetPromise([el])).catch(err => console.warn('MathJax:', err));
}
function clearMath(el) { if (App.mathReady && el) MathJax.typesetClear([el]); }

}

function updateProgress() {
  let done = 0;
  state.levels.forEach((L, i) => { done += L.completed ? LEVELS[i].steps.length : L.solved.filter(Boolean).length; });
  const pct = Math.round((done / TOTAL_STEPS) * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-wrap').setAttribute('aria-valuenow', pct);
  document.getElementById('progress-text').textContent = `${done}/${TOTAL_STEPS} ${t('stepsWord')} • ${pct}%`;
}

function feedbackHTML(fb, p) {
  if (!fb) return '';
  const base = 'mt-3 rounded-xl px-4 py-3 text-[14px] sm:text-[15px] leading-relaxed fade-in rich';
  if (fb.type === 'ok')
    return `<div class="${base} bg-green-100 border border-green-300 text-green-900 font-semibold">✅ ${t('correctMsgs')[fb.i]}</div>`;
  if (fb.type === 'warn')
    return `<div class="${base} bg-gold-light/60 border border-gold text-[#6B4A06]">${t(fb.key, p)}</div>`;
  return `<div class="${base} bg-[#FFF1E6] border border-[#F3C9A8] text-[#7A2E0E]">🤔 <b>${t('almost')}</b> ${t(fb.key, p)}</div>`;

function stepHTML(li, si) {

  return `
  <div class="rounded-2xl border-2 ${box} p-4 sm:p-5 transition-all duration-300">
    <div class="flex gap-3">
      <span class="w-8 h-8 shrink-0 rounded-full ${circle} grid place-items-center font-extrabold text-sm">${solved ? '✓' : si + 1}</span>
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-[15px] sm:text-base leading-relaxed">${t('step')} ${si + 1}: ${t(`l${n}_s${si + 1}`, p)}</p>

          <label for="${id}" class="flex items-center rounded-xl border-2 ${solved ? 'border-green-300 bg-green-50' : 'border-[#E5D8C8] bg-white focus-within:border-maroon'} transition overflow-hidden">
            <span class="pl-3 pr-1 text-maroon font-semibold whitespace-nowrap">\\(${S.sym} =\\)</span>
            <input id="${id}" type="text" inputmode="numeric" autocomplete="off"
              data-level="${li}" data-step="${si}" value="${escAttr(solved ? S.answer(p) : L.values[si])}"
              placeholder="${escAttr(t('placeholder'))}" ${disabled ? 'disabled' : ''}
              class="w-24 sm:w-28 px-2 py-2 text-lg font-bold text-ink bg-transparent disabled:cursor-not-allowed" aria-label="${escAttr(t('step') + ' ' + (si + 1))}">
            <span class="pr-3 text-[#7A675B] font-semibold">${S.unit}</span>
          </label>
          ${solved ? '' : `
          <button type="button" data-action="check" data-level="${li}" data-step="${si}" ${disabled ? 'disabled' : ''}
            class="px-4 py-2.5 rounded-xl bg-gold hover:bg-[#E89A12] active:scale-95 text-maroon-dark font-extrabold shadow-sm transition disabled:opacity-50 disabled:cursor-not-allowed">${t('check')}</button>
          <button type="button" data-action="hint" data-level="${li}" data-step="${si}" ${disabled ? 'disabled' : ''}
            class="px-3 py-2.5 rounded-xl border-2 border-maroon/20 hover:border-maroon/50 text-maroon font-bold text-sm transition disabled:opacity-50 disabled:cursor-not-allowed">${L.showHint[si] ? t('hideHint') : t('hint')}</button>`}
        </div>

        ${!open ? `<p class="mt-2 text-sm text-[#8A7A6D]">${t('lockedStep')}</p>` : ''}
        ${L.showHint[si] && !solved ? `<div class="mt-3 rounded-xl bg-[#FFF8EA] border border-gold/60 px-4 py-3 text-[14px] sm:text-[15px] leading-relaxed fade-in rich">💡 ${t(`l${n}_s${si + 1}_hint`, p)}</div>` : ''}
        ${feedbackHTML(L.feedback[si], p)}
        ${!solved && L.attempts[si] >= 2 && !L.showSol[si] ? `

          </div>` : ''}
        ${L.showSol[si] ? `<div class="mt-3 rounded-xl bg-white border-2 border-maroon/20 px-4 py-3 text-[14px] sm:text-[15px] leading-relaxed fade-in rich"><b class="text-maroon">📘 ${t('solutionLabel')}:</b><br>${t(`l${n}_s${si + 1}_sol`, p)}</div>` : ''}
      </div>
    </div>
  </div>`;
}

    <div class="bg-white rounded-3xl shadow-card border border-[#EADBC8] overflow-hidden">

        <div class="rounded-2xl bg-sand/60 border border-[#EADBC8] p-5 sm:p-6">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2">

            <button type="button" data-action="new" data-level="${li}" class="px-3 py-1.5 rounded-xl bg-white border border-[#E5D8C8] hover:border-gold text-sm font-bold text-maroon transition">${t('newQuestion')}</button>
          </div>
          <p class="text-[15px] sm:text-base leading-relaxed">${t(`l${n}_question`, p)}</p>
          <div class="mt-4 rounded-2xl bg-white border border-[#EADBC8] p-3 sm:p-4">${LEVELS[li].draw(p)}</div>

        <!-- Steps -->
        <div class="space-y-4">
          ${LEVELS[li].steps.map((_, si) => stepHTML(li, si)).join('')}

        ${L.solved.every(Boolean) ? `
          <div class="rounded-2xl bg-gradient-to-br from-green-50 to-[#FFF6E5] border-2 border-green-300 p-5 sm:p-6 text-[15px] sm:text-base fade-in rich">
            <p class="text-sm font-extrabold uppercase tracking-wider text-green-800 mb-1">${t('summaryTitle')}</p>
            ${t(`l${n}_summary`, p)}
          </div>` : ''}
      </div>

  typeset(el);

  // post-render effects
  if (state.shake) {
    const s = document.getElementById(state.shake);
    const wrap = s && s.closest('label');

    state.shake = null;
  }
  if (state.focus) {
    const f = document.getElementById(state.focus);
    if (f && !f.disabled) f.focus({ preventScroll: false });
    state.focus = null;
  }
}

function renderFinal() {
  const el = document.getElementById('final');
  if (!state.levels[2].completed) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="rounded-3xl bg-gradient-to-br from-maroon to-maroon-dark text-white p-6 sm:p-8 text-center shadow-card animate-pop">
      <div class="text-5xl floaty" aria-hidden="true">🏆</div>
      <h2 class="mt-2 text-2xl font-extrabold text-gold">${t('finalBannerTitle')}</h2>

    </div>`;
}

function renderModal() {
  const m = document.getElementById('modal');
  clearMath(m);
  if (!state.modal) { m.classList.add('hidden'); m.innerHTML = ''; return; }
  const { kind, li } = state.modal;
  const final = kind === 'final';
  m.classList.remove('hidden');
  m.innerHTML = `
    <div class="absolute inset-0 bg-[#2B1D1D]/55 backdrop-blur-sm" data-action="modal-close"></div>
    <div class="relative w-full max-w-md rounded-3xl bg-cream border-4 border-gold p-7 text-center shadow-2xl animate-pop">
      <div class="text-6xl floaty" aria-hidden="true">${final ? '🏆' : '🎉'}</div>
      <h3 class="mt-3 text-2xl font-extrabold text-maroon">${final ? t('allDoneTitle') : fmt(t('levelDone'), { n: li + 1 })}</h3>
      <p class="mt-2 text-[#4A3A33] leading-relaxed">${final ? t('allDoneText') : fmt(t('unlockMsg'), { n: li + 2 })}</p>
      <button type="button" id="modal-btn" data-action="modal-close" class="mt-6 w-full px-5 py-3 rounded-2xl bg-gold hover:bg-[#E89A12] active:scale-95 text-maroon-dark font-extrabold text-lg shadow transition">

function renderAll() {
  renderStatic();
  renderHero();
  LEVELS.forEach((_, i) => renderLevel(i));
  renderFinal();
  renderModal();

}

/* =====================================================================
   7. LOGIC: checking answers, hints, unlocking
   ===================================================================== */
function checkStep(li, si) {
  const L = state.levels[li], S = LEVELS[li].steps[si];
  if (L.solved[si] || (si > 0 && !L.solved[si - 1])) return;   // step locked or already done
  const id = `in-${li}-${si}`;

  // normalise input: unicode minus, comma decimal, spaces
  const raw = String(L.values[si] || '').trim().replace(/[−–]/g, '-').replace(',', '.').replace(/\s+/g, '');
  if (!raw) { L.feedback[si] = { type: 'warn', key: 'emptyInput' }; state.shake = id; state.focus = id; renderLevel(li); return; }
  const v = Number(raw);
  if (!Number.isFinite(v)) { L.feedback[si] = { type: 'warn', key: 'notNumber' }; state.shake = id; state.focus = id; renderLevel(li); return; }
  if (!Number.isInteger(v)) { L.feedback[si] = { type: 'warn', key: 'notInteger' }; state.shake = id; state.focus = id; renderLevel(li); return; }

  if (v === S.answer(L.p)) {
    // ✅ correct
    L.solved[si] = true;
    L.showHint[si] = false;
    L.feedback[si] = { type: 'ok', i: rand(0, t('correctMsgs').length - 1) };
    const next = si + 1;
    if (next < LEVELS[li].steps.length) state.focus = `in-${li}-${next}`;
    renderLevel(li);
    updateProgress();
    if (L.solved.every(Boolean)) completeLevel(li);
  } else {
    // ❌ wrong: diagnose the specific misconception
    L.attempts[si]++;
    L.feedback[si] = { type: 'err', key: S.diagnose(v, L.p) };
    state.shake = id; state.focus = id;
    renderLevel(li);
  }
}

function completeLevel(li) {
  const L = state.levels[li];
  const firstTime = !L.completed;
  L.completed = true;
  confetti();
  renderLevel(li);
  updateProgress();
  if (!firstTime) return;                         // repeat practice: just confetti
  setTimeout(() => {
    state.modal = { kind: li === LEVELS.length - 1 ? 'final' : 'level', li };
    renderModal();
    if (li === LEVELS.length - 1) renderFinal();
  }, 700);
}

function closeModal() {
  const m = state.modal;
  state.modal = null;
  renderModal();
  if (m && m.kind === 'level') {
    const next = m.li + 1;
    state.unlocked = Math.max(state.unlocked, next + 1);
    state.justUnlocked = next;
    state.focus = `in-${next}-0`;
    renderLevel(next);
    state.justUnlocked = null;
    setTimeout(() => document.getElementById('level-' + next).scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth', block: 'start' }), 80);
  } else if (m && m.kind === 'final') {
    document.getElementById('final').scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth', block: 'center' });
  }
}

function newQuestion(li) {
  const wasCompleted = state.levels[li].completed;
  state.levels[li] = freshLevelState(li);
  state.levels[li].completed = wasCompleted;      // keep unlock progress
  state.focus = `in-${li}-0`;
  renderLevel(li);
  updateProgress();
}

function setLang(lang) {
  if (lang === state.lang) return;
  state.lang = lang;
  try { localStorage.setItem('abbs-tutor-lang', lang); } catch (e) { /* storage may be blocked */ }
  renderAll();
}

/* =====================================================================
   8. CONFETTI (reward animation, no libraries)
   ===================================================================== */
function confetti() {
  if (prefersReducedMotion) return;
  const c = document.getElementById('confetti'), ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ['#8B1515', '#F5A623', '#FFD166', '#E85D75', '#2BB673', '#4A90E2', '#FFFFFF'];
  const parts = Array.from({ length: 170 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 240, y: innerHeight * 0.38,
    vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 15 - 5,
    s: rand(6, 12), c: pick(colors), rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.35
  }));
  let frame = 0;
  (function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(q => {
      q.vy += 0.38; q.vx *= 0.985; q.x += q.vx; q.y += q.vy; q.rot += q.vr;
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.globalAlpha = Math.max(0, 1 - frame / 200);
      ctx.fillStyle = q.c; ctx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2);
      ctx.restore();
    });
    if (++frame < 200) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

/* =====================================================================
   9. EVENTS (delegated)
   ===================================================================== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const li = Number(b.dataset.level), si = Number(b.dataset.step);
  switch (b.dataset.action) {
    case 'check': checkStep(li, si); break;
    case 'hint': state.levels[li].showHint[si] = !state.levels[li].showHint[si]; state.focus = `in-${li}-${si}`; renderLevel(li); break;
    case 'solution': state.levels[li].showSol[si] = true; state.focus = `in-${li}-${si}`; renderLevel(li); break;
    case 'new': newQuestion(li); break;
    case 'lang': setLang(b.dataset.lang); break;
    case 'modal-close': closeModal(); break;
  }
});
// keep typed values in state so re-renders (e.g. language switch) never lose them
document.addEventListener('input', e => {
  const inp = e.target.closest('input[data-level]');
  if (inp) state.levels[Number(inp.dataset.level)].values[Number(inp.dataset.step)] = inp.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const inp = e.target.closest('input[data-level]');
    if (inp) { e.preventDefault(); checkStep(Number(inp.dataset.level), Number(inp.dataset.step)); }
  }
  if (e.key === 'Escape' && state.modal) closeModal();
});

/* =====================================================================
   10. START
   ===================================================================== */
try { const saved = localStorage.getItem('abbs-tutor-lang'); if (saved === 'id' || saved === 'en') state.lang = saved; } catch (e) { /* ignore */ }
renderAll();
</script>
