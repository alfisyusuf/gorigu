 return s+T2(105,16,lab,'#2563eb','middle',13)+T2(105,140,cap,'#64748b','middle',11)+'</g>'}

 s+=T2(0,78,'in = 12 A','#dc2626','start',12)+T2(190,30,'a = 5 A →','#dc2626','middle',12)+T2(48,114,'b = ? ↓','#ea580c','start',12)+T2(230,122,'c = 3 A →','#dc2626','middle',12)+T2(230,188,'d = ? →','#ea580c','middle',12)+T2(350,118,'out = ?','#ea580c','start',12)+T2(34,104,'P','#1e293b','end',14)+T2(108,122,'Q','#1e293b','end',14)+T2(352,152,'R','#1e293b','start',14);return `<svg viewBox='-10 0 420 200'>${s}</svg>`}
function gr(){let s='';for(let v=0;v<=6;v++)s+=`<line x1='${70+v*60}' y1='20' x2='${70+v*60}' y2='260' stroke='#cbd5e1'/>`+T2(70+v*60,278,v,'#475569','middle',13);for(let i=0;i<=3;i++)s+=`<line x1='70' y1='${260-i*80}' x2='430' y2='${260-i*80}' stroke='#cbd5e1'/>`+T2(60,264-i*80,i,'#475569','end',13);
 s+=L(70,260,445,260)+L(70,260,70,12);[[2,'P','#2563eb'],[1,'Q','#ea580c'],[3,'S','#16a34a']].forEach(a=>{let y=260-a[0]*80;s+=`<line x1='70' y1='260' x2='430' y2='${y}' stroke='${a[2]}' stroke-width='3' stroke-linecap='round'/>`+dc(430,y,a[2])+T2(442,y+5,a[1],a[2],'start',16)});
 s+=T2(250,298,'Voltage (V)','#334155','middle',13)+`<text x='18' y='140' transform='rotate(-90 18 140)' text-anchor='middle' font-size='13' font-weight='700' fill='#334155'>Current (A)</text>`;return `<svg viewBox='0 0 480 305'>${s}</svg>`}
function lps(){let s=L(20,50,65,50)+bh(70,50)+L(75,50,290,50)+L(20,50,20,140)+L(20,140,290,140)+L(290,50,290,140)+box(150,37,'K₁ = 6 V')+box(190,127,'K₂ = ?','#ea580c')+box(60,127,'K₃ = 5 V')+T2(70,32,'ε = 20 V','#2563eb','middle',12)+T2(155,178,'Loop 1','#2563eb','middle',14);
 s+=`<g transform='translate(350,0)'>`+L(20,50,45,50)+bh(50,50)+L(55,50,105,50)+bf(110,50)+L(115,50,290,50)+L(20,50,20,140)+L(20,140,290,140)+L(290,50,290,140)+box(180,37,'M₁ = 3 V')+box(110,127,'M₂ = ?','#ea580c')+T2(50,32,'ε = 15 V','#2563eb','middle',12)+T2(112,32,'ε = 6 V','#2563eb','start',12)+T2(155,178,'Loop 2','#2563eb','middle',14)+'</g>';

 s+=[[140,160,200,110],[140,160,200,210],[400,160,340,110],[400,160,340,210]].map(ds).join('')+[[200,110],[200,210],[340,110],[340,210]].map(a=>cc(a[0],a[1])).join('')+dc(140,160,'#7c3aed')+dc(400,160,'#7c3aed');
 s+=T2(125,186,'S₁','#7c3aed','end',17)+T2(415,186,'S₂','#7c3aed','start',17)+T2(270,100,'top wire','#334155','middle',13)+T2(270,232,'bottom wire','#334155','middle',13)+T2(88,211,'battery','#2563eb','start',13)+T2(502,225,'lamp','#64748b','start',13)+T2(280,296,'Dashed lines = possible lever positions. A lever touches only one contact.','#64748b','middle',12);return `<svg viewBox='0 0 560 305'>${s}</svg>`}

const Q=[
{t:'A resistor of R = 5 Ω carries a current of I = 3 A. What is the source voltage V?',f:ckt('S',{r:['R = 5 Ω'],b:'V = ?',n:'I = 3 A'}),o:['8 V','10 V','12 V','15 V','20 V'],c:'D',w:'Ohm’s law: V = I × R = 3 × 5 = 15 V.'},

{t:'A parallel circuit has V = 18 V, R₁ = 9 Ω and R₂ = 18 Ω. What is the total current from the battery?',f:ckt('P',{r:['R₁ = 9 Ω','R₂ = 18 Ω'],b:'V = 18 V',n:'I total = ?'}),o:['2 A','6 A','3 A','9 A','1 A'],c:'C',w:'1/R = 1/9 + 1/18 = 3/18, so R = 6 Ω. I = 18 / 6 = 3 A.'},
{t:'R₁ = 12 Ω and R₂ = 4 Ω are in parallel. This pair is in series with R₃ = 5 Ω. What is the total resistance?',f:ckt('M',{r:['R₃ = 5 Ω','R₁ = 12 Ω','R₂ = 4 Ω'],b:'Battery',n:'R_total = ?'}),o:['3 Ω','5 Ω','12 Ω','16 Ω','8 Ω'],c:'E',w:'Parallel part: (12 × 4) / (12 + 4) = 3 Ω. Then 3 + 5 = 8 Ω.'},
{t:'R₁ = 6 Ω and R₂ = 3 Ω are in parallel. This pair is in series with R₃ = 4 Ω. The source is 18 V. What is the total current?',f:ckt('M',{r:['R₃ = 4 Ω','R₁ = 6 Ω','R₂ = 3 Ω'],b:'V = 18 V',n:'I total = ?'}),o:['1,5 A','3 A','2 A','4,5 A','6 A'],c:'B',w:'Parallel part: 1/6 + 1/3 = 1/2, so 2 Ω. R_total = 2 + 4 = 6 Ω. I = 18 / 6 = 3 A.'},
{t:'Look at the junction. Currents I₁ = 7 A and I₂ = 4 A enter it. I₃ = 6 A leaves it. What is I₄, which also leaves the junction?',f:node(['I₁ = 7 A (in)','I₂ = 4 A (in)','I₃ = 6 A (out)','I₄ = ? (out)']),o:['5 A','3 A','6 A','9 A','11 A'],c:'A',w:'Kirchhoff’s first law: current in = current out. 7 + 4 = 6 + I₄, so I₄ = 5 A.'},
{t:'A device with resistance 5 Ω carries a current of 3 A. How much electric power does it use?',f:ckt('S',{r:['R = 5 Ω'],b:'Battery',n:'I = 3 A, P = ?'}),o:['15 W','30 W','45 W','60 W','90 W'],c:'C',w:'P = I² × R = 3² × 5 = 45 W.'},
{t:'A 300 W device is used for 4 hours every day. The price of electricity is Rp 1.500 per kWh. What is the cost for 30 days?',f:'',o:['Rp 27.000','Rp 36.000','Rp 45.000','Rp 54.000','Rp 72.000'],c:'D',w:'Energy = 0,3 kW × (4 × 30) h = 36 kWh. Cost = 36 × 1.500 = Rp 54.000.'},
{t:'In the closed series circuit, the battery is 30 V. The voltage across R₁ is 7 V and across R₂ is 9 V. What is the voltage across R₃?',f:ckt('S',{r:['V₁ = 7 V','V₂ = 9 V','V₃ = ?'],b:'V = 30 V',n:'Series circuit'}),o:['16 V','14 V','12 V','10 V','23 V'],c:'B',w:'Kirchhoff’s second law: 30 = 7 + 9 + V₃, so V₃ = 14 V.'},
{t:'Read the text. Wire P has a resistance of 3 Ω. Wire Q is made of the same copper, but it is 2 times longer than P. Wire R is 2 times thicker (cross-section area) than P. Wire S is both 2 times longer and 2 times thicker than P. Choose the TWO true statements.',m:1,f:'',o:['A thicker wire has a higher resistance, because electrons are crowded.','Wire Q has a resistance of 6 Ω.','Thickness does not change resistance. Only length matters.','Two wires of the same size always have the same resistance, even if the metals differ.','Wire S has a resistance of 3 Ω.'],c:'B,E',w:'R = ρL/A. Q: length ×2, so 6 Ω (B true). R: area ×2, so 1,5 Ω (A false: thicker means lower resistance). S: ×2 and ×½ cancel, so 3 Ω (E true). Different metals have different resistivity (D false). Area matters (C false).'},
{t:'A computer fan is in series with a temperature sensor and a 9 V battery. When the temperature rises, the sensor resistance goes down. The fan runs only when its voltage is 5 V or more.<br>Voltage across the fan: 20 °C → 1,5 V; 35 °C → 4 V; 50 °C → 7 V. Decide whether each statement is True or False.',s:['At 20 °C, the voltage across the sensor is 1,5 V.','At 50 °C, the fan runs.','At 35 °C, the voltage across the sensor is 5 V.'],f:'',c:'S,B,B',w:'In series, sensor + fan = 9 V. (1) At 20 °C the sensor has 9 − 1,5 = 7,5 V, so False. (2) 7 V is more than 5 V, so the fan runs: True. (3) 9 − 4 = 5 V, so True.'},
{t:'Two batteries face each other (opposite polarity) in a closed circuit. E₁ = 30 V, E₂ = 12 V, R₁ = 4 Ω and R₂ = 5 Ω. What is the current?',f:ckt2({top:['R₁ = 4 Ω'],bot:['R₂ = 5 Ω'],bl:'E₁ = 30 V',br:'E₂ = 12 V'}),o:['0,5 A','1 A','3 A','4 A','2 A'],c:'E',w:'Opposing batteries subtract: 30 − 12 = 18 V. R_total = 4 + 5 = 9 Ω. I = 18 / 9 = 2 A.'},
{t:'Two batteries are connected in the same direction with three resistors in series. E₁ = 10 V, E₂ = 8 V, R₁ = 1 Ω, R₂ = 3 Ω and R₃ = 2 Ω. What is the current?',f:ckt2({same:1,top:['R₁ = 1 Ω','R₃ = 2 Ω'],bot:['R₂ = 3 Ω'],bl:'E₁ = 10 V',br:'E₂ = 8 V'}),o:['1 A','2 A','4 A','3 A','6 A'],c:'D',w:'Batteries in the same direction add: 10 + 8 = 18 V. R_total = 1 + 3 + 2 = 6 Ω. I = 18 / 6 = 3 A.'},
{t:'A series circuit has a battery of 18 V, R₁ = 6 Ω and R₂ = 3 Ω. What is the voltage at point A (between R₁ and R₂), measured from the negative terminal of the battery?',f:ckt('S',{r:['R₁ = 6 Ω','R₂ = 3 Ω'],b:'V = 18 V',n:'Point A is measured from the − terminal',dot:'A'}),o:['3 V','6 V','9 V','12 V','18 V'],c:'B',w:'I = 18 / (6 + 3) = 2 A. The voltage at A equals the voltage across R₂: V = I × R₂ = 2 × 3 = 6 V. (Voltage divider: 18 × 3/9 = 6 V.)'},
{t:'Two batteries face each other (opposite polarity) and are connected to one resistor. Each battery has an internal resistance. ε₁ = 30 V, ε₂ = 6 V, r₁ = 1 Ω, r₂ = 2 Ω and R = 5 Ω. What is the current?',f:ckt2({top:['R = 5 Ω'],bl:'ε₁ = 30 V',bl2:'r₁ = 1 Ω',br:'ε₂ = 6 V',br2:'r₂ = 2 Ω'}),o:['3 A','2 A','4 A','6 A','1,5 A'],c:'A',w:'Net emf = 30 − 6 = 24 V. Total resistance = R + r₁ + r₂ = 5 + 1 + 2 = 8 Ω. I = 24 / 8 = 3 A.'},
{t:'Two batteries face each other (opposite polarity) and are connected to one resistor. ε₁ = 24 V, ε₂ = 6 V, r₁ = 2 Ω, r₂ = 1 Ω and R = 3 Ω. What is the terminal voltage of battery 1?',f:ckt2({top:['R = 3 Ω'],bl:'ε₁ = 24 V',bl2:'r₁ = 2 Ω',br:'ε₂ = 6 V',br2:'r₂ = 1 Ω'}),o:['24 V','21 V','15 V','18 V','12 V'],c:'D',w:'I = (24 − 6) / (3 + 2 + 1) = 3 A. Battery 1 gives current, so its terminal voltage is ε₁ − I × r₁ = 24 − 3 × 2 = 18 V.'},
{t:'The circuit has two loops that share R₃. ε₁ = 13 V, R₁ = 1 Ω, ε₂ = 5 V, R₂ = 3 Ω and R₃ = 2 Ω. What is the current through R₃ (from C to F)?',f:br({r1:'R₁ = 1 Ω',e1:'ε₁ = 13 V',r3:'R₃ = 2 Ω',r2:'R₂ = 3 Ω',e2:'ε₂ = 5 V'}),o:['3 A','4 A','5 A','1 A','2 A'],c:'B',w:'Let both loop currents go clockwise. Loop 1: 13 − I₁ − 2(I₁ − I₂) = 0, so 3I₁ − 2I₂ = 13. Loop 2: −5 − 3I₂ + 2(I₁ − I₂) = 0, so 2I₁ − 5I₂ = 5. Solving: I₁ = 5 A and I₂ = 1 A. Current in R₃ = I₁ − I₂ = 4 A.'},
{t:'Same type of circuit as before (two loops sharing R₃). ε₁ = 14 V, R₁ = 2 Ω, ε₂ = 5 V, R₂ = 1 Ω and R₃ = 2 Ω. What is the voltage across R₁?',f:br({r1:'R₁ = 2 Ω',e1:'ε₁ = 14 V',r3:'R₃ = 2 Ω',r2:'R₂ = 1 Ω',e2:'ε₂ = 5 V'}),o:['6 V','14 V','4 V','10 V','8 V'],c:'E',w:'Loop 1: 14 − 2I₁ − 2(I₁ − I₂) = 0, so 2I₁ − I₂ = 7. Loop 2: −5 − I₂ + 2(I₁ − I₂) = 0, so 2I₁ − 3I₂ = 5. Subtract: 2I₂ = 2, so I₂ = 1 A and I₁ = 4 A. V₁ = I₁ × R₁ = 4 × 2 = 8 V.'},
{t:'The circuit has one battery ε = 28 V (no internal resistance) and 12 resistors. The currents are: battery 6 A; top and bottom resistors 6 A, 2 A, 1 A; vertical branches 4 A, 1 A, 1 A (flowing downward). The resistances are on the picture. Use only Kirchhoff’s second law to find Rx, Ry and Rz.',f:net({e:'ε = 28 V',top:['1 Ω','2 Ω','1 Ω'],bot:['1 Ω','3 Ω','1 Ω'],up:['2 Ω','5 Ω','1 Ω'],lo:['Rx = ?','Ry = ?','Rz = ?']}),o:['Rx = 1 Ω, Ry = 2 Ω, Rz = 3 Ω','Rx = 2 Ω, Ry = 1 Ω, Rz = 3 Ω','Rx = 3 Ω, Ry = 1 Ω, Rz = 2 Ω','Rx = 2 Ω, Ry = 3 Ω, Rz = 1 Ω','Rx = 1 Ω, Ry = 3 Ω, Rz = 2 Ω'],c:'B',w:'Each loop has only one unknown. Loop 1: 28 − 6(1) − 4(2 + Rx) − 6(1) = 0, so Rx = 2 Ω. Loop 2 (go up the left branch, down the middle): +4(4) − 2(2) − 1(5 + Ry) − 2(3) = 0, so Ry = 1 Ω. Loop 3: +1(6) − 1(1) − 1(1 + Rz) − 1(1) = 0, so Rz = 3 Ω.'},
{t:'The circuit has a battery ε = 30 V and 12 resistors R₁ to R₁₂. The voltage across most resistors is on the picture. The voltage drop follows the current: left to right on top, right to left on the bottom, and top to bottom in the vertical branches. Use only Kirchhoff’s second law to find the voltages across R₇ and R₅.',f:net({e:'ε = 30 V',top:['R₁ = 4 V','R₂ = 5 V','R₃ = 3 V'],bot:['R₁₀ = 3 V','R₁₁ = 4 V','R₁₂ = 3 V'],up:['R₄ = 12 V','R₅ = ?','R₆ = 4 V'],lo:['R₇ = ?','R₈ = 6 V','R₉ = 4 V']}),o:['V(R₇) = 9 V and V(R₅) = 8 V','V(R₇) = 11 V and V(R₅) = 6 V','V(R₇) = 10 V and V(R₅) = 9 V','V(R₇) = 11 V and V(R₅) = 8 V','V(R₇) = 12 V and V(R₅) = 7 V'],c:'D',w:'Loop 1: 30 − 4 − 12 − V(R₇) − 3 = 0, so V(R₇) = 11 V. Loop 2: −5 − V(R₅) − 6 − 4 + 11 + 12 = 0, so V(R₅) = 8 V. Check loop 3: −3 − 4 − 4 − 3 + 6 + 8 = 0.'},
{t:'A 16 V battery (no internal resistance) is in series with R₁ = 1 Ω. After that, R₂ = 4 Ω and R₃ = 12 Ω are connected in parallel. What is the current through R₂?',f:ckt('M',{r:['R₁ = 1 Ω','R₂ = 4 Ω','R₃ = 12 Ω'],b:'V = 16 V',n:'I₂ = ?'}),o:['1 A','2 A','3 A','4 A','1,5 A'],c:'C',w:'Key point: the question asks for the current in R₂, not the total current. Parallel part: (4 × 12) / 16 = 3 Ω. R_total = 1 + 3 = 4 Ω, so I = 16 / 4 = 4 A. Voltage on the parallel part = 16 − 4 × 1 = 12 V. I₂ = 12 / 4 = 3 A. Check: I₃ = 12 / 12 = 1 A, and 3 + 1 = 4 A.'},
{t:'A 30 V battery (no internal resistance) is connected to three parallel resistors: R₁ = 6 Ω, R₂ = 10 Ω and R₃ (unknown). The total current from the battery is 10 A. What is R₃?',f:p3({b:'ε = 30 V',lab:[['R₁=6Ω'],['R₂=10Ω'],['R₃=?']],n:'Total current I = 10 A'}),o:['3 Ω','15 Ω','10 Ω','6 Ω','5 Ω'],c:'B',w:'Key point: 10 A is the TOTAL current. Every branch has 30 V. I₁ = 30 / 6 = 5 A and I₂ = 30 / 10 = 3 A. Kirchhoff’s first law: 10 = 5 + 3 + I₃, so I₃ = 2 A. R₃ = 30 / 2 = 15 Ω.'},
{t:'Two batteries, ε₁ = 16 V and ε₂ = 4 V, have their + terminals at the top. The left branch has ε₁ and R₁ = 2 Ω. The middle branch has R₃ = 2 Ω. The right branch has ε₂ and R₂ = 1 Ω. Find the size and direction of the current in R₂.',f:p3({nosrc:1,pq:1,bat:[1,0,1],lab:[['ε₁=16V','R₁=2Ω'],['R₃=2Ω'],['ε₂=4V','R₂=1Ω']],n:'Both + terminals are on top'}),o:['2 A, upward','2 A, downward','3 A, downward','5 A, upward','3 A, upward'],c:'B',w:'Assume I₁ and I₂ go upward and I₃ = I₁ + I₂ goes down through R₃. Left loop: 16 − 2I₁ − 2(I₁ + I₂) = 0, so 2I₁ + I₂ = 8. Right loop: 4 − I₂ − 2(I₁ + I₂) = 0, so 2I₁ + 3I₂ = 4. Subtract: 2I₂ = −4, so I₂ = −2 A. The minus sign means the real current in R₂ goes downward: battery 2 is being charged by battery 1.'},
{t:'A 32 V battery (no internal resistance) is in series with R₁ = 2 Ω. Then the circuit splits into two branches. Branch 1 has R₂ = 12 Ω. Branch 2 has R₃ = 5 Ω in series with R₄ = 7 Ω. What is the current through R₄?',f:ckt('M',{two:1,r:['R₁ = 2 Ω','R₂ = 12 Ω','R₃ = 5 Ω','R₄ = 7 Ω'],b:'V = 32 V',n:'I₄ = ?'}),o:['1 A','4 A','3 A','2 A','8 A'],c:'D',w:'Key point: R₃ and R₄ are in series, so they carry the same current. Branch 2 = 5 + 7 = 12 Ω, the same as branch 1, so the current splits equally. Parallel part = 6 Ω, R_total = 2 + 6 = 8 Ω, I = 32 / 8 = 4 A. Voltage on the branches = 32 − 4 × 2 = 24 V. I₄ = 24 / 12 = 2 A (half of the total current).'},
{t:'A flashlight needs a closed path and enough push from its batteries. Every battery here is 2 V. Batteries that point the same way add up. Batteries that point the opposite way subtract. Net push: 4 V = bright lamp, 2 V = dim lamp, 0 V = lamp off. An open switch breaks the path, so the lamp is off.<br>Long line = + pole, short thick line = − pole. All lamps are identical. Decide whether each statement is True or False.',f:`<svg viewBox='0 0 440 300'>${arrg([1,1,1,0],0,'Arrangement 1','4 batteries',0,0)+arrg([1,1,0],0,'Arrangement 2','3 batteries',230,0)+arrg([1,1],1,'Arrangement 3','2 batteries, switch S open',0,150)+arrg([1,0],0,'Arrangement 4','2 batteries',230,150)}</svg>`,s:['The lamp in Arrangement 2 is brighter than the lamp in Arrangement 1.','The lamp in Arrangement 1 is bright, even though one battery points the other way.','The lamp in Arrangement 3 is off because its net push is 0 V.'],c:'S,B,S',w:'Net push: Arrangement 1 = 2 + 2 + 2 − 2 = 4 V (bright). Arrangement 2 = 2 + 2 − 2 = 2 V (dim). Arrangement 3 has 4 V, but the switch is open (off). Arrangement 4 = 2 − 2 = 0 V (off). (1) False: 2 is dimmer than 1. (2) True: 4 V. (3) False: it is off because of the open switch, not because of 0 V.'},
{t:'A power strip has a fuse. The fuse breaks if the total current of all appliances that are ON is more than 12 A. Exactly 12 A is still safe. The fuse current is the SUM of the currents of all appliances that are on.<br>Water heater: 6 A · Iron: 4 A · TV: 3 A · Fan: 2 A.<br>Choose the TWO true statements.',m:1,f:'',o:['All four appliances can be on at the same time.','The water heater, iron and fan together are safe, but adding the TV breaks the fuse.','The fuse current is equal to the current of the biggest appliance.','The water heater and the TV together are safe.','Appliances with a small current, like the fan, are not counted by the fuse.'],c:'B,D',w:'(A) False: 6 + 4 + 3 + 2 = 15 A, more than 12 A. (B) True: 6 + 4 + 2 = 12 A is safe; with the TV it is 15 A. (C) False: it is the sum. (D) True: 6 + 3 = 9 A. (E) False: every appliance that is on is counted.'},
{t:'A lamp is brighter when it gets more voltage. Identical lamps in series share the battery voltage equally. There is only one path, so if one lamp is removed, all lamps go off. The battery is 9 V and all lamps are identical. Choose the TWO true statements.',m:1,f:`<svg viewBox='0 0 660 190'>${ser(1,0,'Circuit X','1 lamp')+ser(2,220,'Circuit Y','2 lamps in series')+ser(3,440,'Circuit Z','3 lamps in series')}</svg>`,o:['The lamp in X is dimmer than the lamps in Y.','Each lamp in Z gets 3 V.','The lamps in Y and Z are equally bright.','If one lamp in Z is removed, the other two stay on.','The lamps in Y are brighter than the lamps in Z.'],c:'B,E',w:'X: 9 V. Y: 9 / 2 = 4,5 V each. Z: 9 / 3 = 3 V each. (A) False: 9 V is brighter than 4,5 V. (B) True. (C) False: 4,5 V ≠ 3 V. (D) False: series, one path. (E) True: 4,5 V > 3 V.'},
{t:'At a wire junction, current in = current out. No current is stored or lost. The current entering P is 12 A. The top path carries a = 5 A. The lower path carries b to Q, where it splits into c = 3 A and d. All paths meet again at R.<br>Choose the TWO true statements.',m:1,f:kn(),o:['The current d is 5 A.','The current b is 7 A.','The current c is bigger than the current d.','The current leaving R is 12 A.','Some current is used up at P, Q or R, so less than 12 A leaves R.'],c:'B,D',w:'At P: 12 = 5 + b, so b = 7 A. At Q: 7 = 3 + d, so d = 4 A. At R: 5 + 3 + 4 = 12 A. (A) False: d = 4 A. (B) True. (C) False: 3 < 4. (D) True. (E) False: current is not used up.'},
{t:'Resistance (Ω) = Voltage (V) ÷ Current (A). A student measured three resistors P, Q and S at different voltages. Each point on a line shows a voltage and the current for that resistor.<br>Choose the TWO true statements.',m:1,f:gr(),o:['Resistor Q has a resistance of 1 Ω.','At 6 V, resistor P carries more current than resistor S.','Resistor S has the smallest resistance, 2 Ω.','A flatter line means a lower resistance.','At 3 V, the current through resistor P is 1 A.'],c:'C,E',w:'At 6 V: P = 6 ÷ 2 = 3 Ω; Q = 6 ÷ 1 = 6 Ω; S = 6 ÷ 3 = 2 Ω. (A) False: Q = 6 Ω. (B) False: P has 2 A, S has 3 A. (C) True. (D) False: a flatter line means less current, so a higher resistance. (E) True: 3 V ÷ 3 Ω = 1 A.'},
{t:'Think of a roller coaster: after one full lap you are back at the same height, so total climb = total drop. In a closed circuit, batteries are the climbs and the other components use the voltage (the drops). In one full loop, the net battery voltage equals the total voltage of the components. If two batteries face opposite ways, the net voltage is their difference.<br>Choose the TWO true statements.',m:1,f:lps(),o:['The voltage across M₂ is 9 V, the net battery voltage.','The voltage across K₂ is 9 V.','The voltages across M₁ and M₂ add up to 21 V.','The voltage across K₂ is 11 V.','The voltage across M₂ is 6 V.'],c:'B,E',w:'Loop 1: 20 = 6 + K₂ + 5, so K₂ = 9 V. Loop 2: net voltage = 15 − 6 = 9 V, so 9 = 3 + M₂ and M₂ = 6 V. (A) False: 9 V is the net battery voltage. (B) True. (C) False: M₁ + M₂ = 9 V. (D) False. (E) True.'},
{t:'A stair light can be switched from upstairs and downstairs with two switches, S₁ and S₂. Each lever touches only ONE contact: top or bottom. The top wire joins the two top contacts. The bottom wire joins the two bottom contacts. The lamp is on only if there is a closed path: the current must leave S₁ on one wire and enter S₂ from the same wire.<br>Decide whether each statement is True or False.',f:stair(),s:['If both levers touch their bottom contacts, the lamp is on.','If S₁ touches the top contact and S₂ touches the bottom contact, the lamp is on.','The lamp is on. If only S₁ is moved to its other contact, the lamp goes off.'],c:'B,S,B',w:'The lamp is on when both levers are on the same side (both top or both bottom). (1) True: both bottom, closed path. (2) False: the current goes through the top wire, but S₂ touches the bottom contact, so the path is broken. (3) True: moving only one lever puts the two levers on different sides.'},
{t:'A resistor works like a gate on a road. Total resistance (Ω) = battery voltage (V) ÷ total current (A). A student uses a 24 V battery and three setups of identical resistors. Setup A has one resistor. In setup B a second resistor is added in the same path (series). In setup C a second resistor is added in a new branch (parallel).<br>Measured total current: A = 3 A · B = 1,5 A · C = 6 A.<br>Decide whether each statement is True or False.',f:abc(),s:['The total resistance of setup A is 8 Ω.','Setup C has the largest total resistance.','Adding the second resistor in a new branch (setup C) makes the total current smaller.'],c:'B,S,S',w:'A: 24 ÷ 3 = 8 Ω. B: 24 ÷ 1,5 = 16 Ω. C: 24 ÷ 6 = 4 Ω. (1) True. (2) False: C has the smallest (4 Ω); B has the largest (16 Ω). (3) False: in C the current rises from 3 A to 6 A. A resistor in series (B) is what makes the current smaller.'},
{t:'An air conditioner has a power of 800 W. It is used for 6 hours every day. How much electric energy does it use in 30 days? Give the answer in Wh (watt-hour).',f:'',o:['24.000 Wh','144.000 Wh','4.800 Wh','14.400 Wh','144 Wh'],c:'B',w:'Total time = 6 h/day × 30 days = 180 h. Energy E = P × t = 800 W × 180 h = 144.000 Wh (that is 144 kWh).'},
{t:'Two resistors are connected in parallel to a 24 V battery: R₁ = 8 Ω and R₂ = 12 Ω. What is the electric power used by R₁?',f:ckt('P',{r:['R₁ = 8 Ω','R₂ = 12 Ω'],b:'V = 24 V',n:'P₁ = ?'}),o:['36 W','48 W','144 W','72 W','24 W'],c:'D',w:'In a parallel circuit every branch has the full battery voltage, so V₁ = 24 V. P₁ = V² / R₁ = 24² / 8 = 576 / 8 = 72 W. (Another way: I₁ = 24 / 8 = 3 A, P₁ = 24 × 3 = 72 W.)'},
{t:'In the closed series circuit, the battery voltage is 15 V and the voltage across resistor 1 is 6 V. What is the voltage across resistor 2?',f:ckt('S',{r:['V₁ = 6 V','V₂ = ?'],b:'V = 15 V',n:'Series circuit'}),o:['9 V','6 V','21 V','7,5 V','15 V'],c:'A',w:'In a series circuit the battery voltage is shared by the components (Kirchhoff’s second law): 15 = 6 + V₂, so V₂ = 9 V.'},
{t:'In the closed series circuit, the battery voltage is 20 V, the voltage across resistor 1 is 14 V, and resistor 2 has R₂ = 3 Ω. What is the current through resistor 2?',f:ckt('S',{r:['V₁ = 14 V','R₂ = 3 Ω'],b:'V = 20 V',n:'I₂ = ?'}),o:['0,5 A','4 A','2 A','1 A','6 A'],c:'C',w:'Step 1: 20 = 14 + V₂, so V₂ = 6 V. Step 2 (Ohm’s law): I₂ = V₂ / R₂ = 6 / 3 = 2 A.'}
];
const qs=document.getElementById('qs');let done=0;
Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';let h=`<span class="n">Question ${i+1}</span><p>${q.t}</p>`;
 if(q.f)h+=`<div class="fig">${q.f}</div>`;
 if(q.s){h+='<table><tr><th>Statement</th><th>True</th><th>False</th></tr>'+q.s.map((s,j)=>`<tr><td>${j+1}. ${s}</td><td class="c"><input type="radio" name="q${i}r${j}" value="B"></td><td class="c"><input type="radio" name="q${i}r${j}" value="S"></td></tr>`).join('')+'</table>'}
 else{if(q.m)h+='<p class="hint">Choose 2 answers.</p>';h+=q.o.map((o,j)=>`<label class="o"><input type="${q.m?'checkbox':'radio'}" name="q${i}" value="${'ABCDE'[j]}"><b>${'ABCDE'[j]}</b><span>${o}</span></label>`).join('')}
 h+=`<button disabled>Check answer</button><div class="ex"><p></p><p>${q.w}</p></div>`;d.innerHTML=h;qs.appendChild(d);
 const btn=d.querySelector('button'),ins=[...d.querySelectorAll('input')];
 const get=()=>{if(q.s){const v=q.s.map((_,j)=>(d.querySelector(`input[name=q${i}r${j}]:checked`)||{}).value);return v.every(Boolean)?v.join(','):''}
  const v=ins.filter(x=>x.checked).map(x=>x.value);return q.m?(v.length==2?v.join(','):''):v[0]||''};
 ins.forEach(x=>x.onchange=()=>btn.disabled=!get());
 btn.onclick=()=>{const a=get(),ok=a==q.c;q.ok=ok;d.classList.add('done');ins.forEach(x=>x.disabled=true);
  if(q.s){q.s.forEach((_,j)=>{const k=q.c.split(',')[j],r=d.querySelector(`input[name=q${i}r${j}][value=${k}]`).parentNode;r.classList.add('ok');const u=d.querySelector(`input[name=q${i}r${j}]:checked`).parentNode;if(u!==r)u.classList.add('bad')})}
  else ins.forEach(x=>{const l=x.parentNode;if(q.c.split(',').includes(x.value))l.classList.add('ok');else if(x.checked)l.classList.add('bad')});
  const e=d.querySelector('.ex');e.classList.add('show');if(!ok)e.classList.add('bad');e.firstChild.innerHTML='<b>'+(ok?'Correct':'Not quite')+'</b> · Answer: '+q.c.replace(/S/g,'False').replace(/B(?=,|$)/g,q.s?'True':'B');
  btn.hidden=true;done++;document.getElementById('pf').style.width=done/Q.length*100+'%';
  if(done==Q.length){document.getElementById('sc').textContent=Q.filter(x=>x.ok).length+' / '+Q.length;document.getElementById('res').hidden=false}}});
</script></body></html>
