<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Try Out Fisika</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f4f6f8;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#dfe3e8;--pri:#0d9488;--pri2:#ccfbf1;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--wat:#bae6fd;--gls:#e0f2fe;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1419;--card:#1a2129;--ink:#e5e7eb;--mut:#9ca3af;--line:#2f3a45;--pri:#2dd4bf;--pri2:#134e4a;--ok:#4ade80;--okb:#14351f;--bad:#f87171;--badb:#3b1818;--wat:#0c4a6e;--gls:#1e3a4a;color-scheme:dark}}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 0 8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1{font-size:1.15rem;margin:0}header p{margin:0;color:var(--mut);font-size:.85rem}
.bar{height:6px;background:var(--line);border-radius:9px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
nav{display:flex;gap:8px;overflow-x:auto}nav a{flex:none;min-width:38px;text-align:center;padding:4px 10px;border-radius:9px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.85rem;font-weight:600}
nav a.done{background:var(--pri2);border-color:var(--pri)}nav a.ok{background:var(--okb);border-color:var(--ok)}nav a.bad{background:var(--badb);border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.hd b{font-size:1.05rem}
.tag{font-size:.72rem;background:var(--pri2);color:var(--ink);padding:2px 9px;border-radius:99px}
.card p{margin:.4em 0}
figure{margin:12px 0;display:flex;flex-direction:column;align-items:center}figure svg{max-width:100%;height:auto}figcaption{font-size:.8rem;color:var(--mut)}
.op{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;transition:.15s}
.op:hover{border-color:var(--pri)}.op input{position:absolute;opacity:0}
.op i{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-style:normal;font-size:.8rem;font-weight:700}
.op:has(input:checked){border-color:var(--pri);background:var(--pri2)}.op:has(input:checked) i{background:var(--pri);border-color:var(--pri);color:#fff}
.op:has(input:focus-visible){outline:2px solid var(--pri)}
.op.ok{border-color:var(--ok);background:var(--okb)}.op.bad{border-color:var(--bad);background:var(--badb)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:8px;min-width:420px}
th{background:var(--pri);color:#042f2e;padding:8px;font-size:.8rem}td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}td+td{text-align:center;width:72px}
td input{width:20px;height:20px;accent-color:var(--pri)}tr.ok td{background:var(--okb)}tr.bad td{background:var(--badb)}
.why{display:none;margin-top:12px;padding:10px 12px;border-left:4px solid var(--pri);background:var(--bg);border-radius:6px;font-size:.92rem}.checked .why{display:block}
.row{display:flex;gap:8px;align-items:center;margin-top:12px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;background:var(--pri);color:#042f2e;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.g{background:transparent;border:1px solid var(--line);color:var(--ink)}
.res{font-weight:700}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
footer .wrap{display:flex;gap:8px;align-items:center}#sc{margin-left:auto;font-weight:700}
.ln{stroke:var(--ink);fill:none;stroke-width:1.6}.th{stroke-width:3}.dsh{stroke:var(--mut);fill:none;stroke-dasharray:4 4}.tx{fill:var(--ink);font:12px system-ui,sans-serif}.it{font-style:italic;font-size:14px;paint-order:stroke;stroke:var(--card);stroke-width:4px}
.wt{fill:var(--wat)}.mt{fill:#6b7280}.rd{fill:#dc2626;stroke:none}.rs{stroke:#dc2626;stroke-width:2}.ink{fill:var(--ink)}.bx{fill:var(--gls);stroke:var(--mut)}.gr{fill:#4ade80;stroke:#166534}
</style>
</head>
<body>
<header><div class="wrap"><h1>Try Out Fisika</h1><p>Jawab, lalu tekan “Periksa” untuk melihat kunci dan pembahasan.</p><div class="bar"><i id="pb"></i></div><nav id="nav"></nav></div></header>
<main class="wrap" id="qs"></main>
<footer><div class="wrap"><button id="all">Periksa semua</button><button class="g" id="rst">Ulangi</button><span id="sc"></span></div></footer>
<script>
const $=s=>document.querySelector(s),L='ABCDE';
const AH=id=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker>`;
const lab=(x,y,t,a)=>`<text class="tx" x="${x}" y="${y}" text-anchor="${a||'start'}">${t}</text>`;

/* Soal 9: tabung resonansi */
const fig9=()=>`<svg viewBox="0 0 340 290" width="340" role="img" aria-label="Tabung berisi air dengan garpu tala di atasnya, katup di dasar, jarak x dan y diukur dari mulut tabung">
<defs>${AH('a9')}</defs>
<rect class="wt" x="121" y="76" width="78" height="174"/>
<line class="dsh" x1="121" y1="124" x2="199" y2="124"/><line class="dsh" x1="121" y1="190" x2="199" y2="190"/>
<path class="ln th" d="M120 70V252H200V70"/>
<rect class="mt" x="200" y="232" width="110" height="10" rx="2"/><rect class="ink" x="206" y="226" width="16" height="22" rx="2"/><rect class="rd" x="210" y="214" width="8" height="12" rx="1"/>
<path class="ln th" d="M150 38H106a9 9 0 0 0 0 18H150M97 47H70"/>
<line class="dsh" x1="55" y1="70" x2="120" y2="70"/><line class="dsh" x1="55" y1="124" x2="120" y2="124"/><line class="dsh" x1="55" y1="190" x2="120" y2="190"/>
<line class="ln" x1="95" y1="72" x2="95" y2="122" marker-start="url(#a9)" marker-end="url(#a9)"/>
<line class="ln" x1="58" y1="72" x2="58" y2="188" marker-start="url(#a9)" marker-end="url(#a9)"/>
<text class="tx it" x="100" y="102">x</text><text class="tx it" x="40" y="134">y</text>
${lab(30,22,'<tspan font-weight="600">Garpu tala</tspan>')}<line class="ln" x1="62" y1="27" x2="80" y2="44" stroke-width="1"/>
${lab(222,150,'<tspan font-weight="600">Cairan</tspan>')}<line class="ln" x1="219" y1="146" x2="185" y2="146" stroke-width="1"/>
${lab(250,208,'<tspan font-weight="600">Katup</tspan>')}<line class="ln" x1="252" y1="212" x2="222" y2="230" stroke-width="1"/></svg>`;

/* Soal 10: Van de Graaff */
const fig10=()=>`<svg viewBox="0 0 360 270" width="360" role="img" aria-label="Generator Van de Graaff di kiri, bola kecil tergantung benang dari langit-langit membentuk sudut 45 derajat terhadap vertikal, jarak r dari pusat generator ke garis vertikal benang">
<defs>${AH('a10')}</defs>
<polygon class="mt" points="40,250 120,250 105,222 55,222"/><rect class="mt" x="64" y="122" width="10" height="100"/><rect class="mt" x="86" y="122" width="10" height="100"/>
<circle cx="80" cy="82" r="40" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>
<rect class="ink" x="190" y="18" width="110" height="6"/>
<line class="dsh" x1="250" y1="24" x2="250" y2="150"/>
<line class="ln th" x1="250" y1="24" x2="179" y2="95" stroke-width="2"/>
<circle cx="179" cy="95" r="8" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>
<path class="ln" d="M250 64A40 40 0 0 1 221.7 52.3" stroke-width="1.2"/><text class="tx" x="256" y="76">45°</text>
<line class="dsh" x1="80" y1="82" x2="80" y2="34"/>
<line class="ln" x1="82" y1="38" x2="248" y2="38" marker-start="url(#a10)" marker-end="url(#a10)" stroke-width="1.2"/><text class="tx it" x="160" y="32">r</text>
${lab(150,160,'<tspan font-weight="600">Bola kecil</tspan>','middle')}<line class="ln" x1="160" y1="146" x2="176" y2="106" stroke-width="1"/>
${lab(180,205,'<tspan font-weight="600">Generator</tspan>')}${lab(180,220,'<tspan font-weight="600">Van de Graaff</tspan>')}<line class="ln" x1="176" y1="198" x2="98" y2="170" stroke-width="1"/></svg>`;

/* Soal 13: mata miopia */
const tree=(x,y,s,c)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-5" y="0" width="10" height="38" fill="#7c5a2e"/><circle cy="-18" r="22" class="${c}"/><circle cx="-15" cy="-2" r="16" class="${c}"/><circle cx="15" cy="-2" r="16" class="${c}"/></g>`;
const fig13=()=>`<svg viewBox="0 0 520 210" width="520" role="img" aria-label="Berkas cahaya dari pohon dibiaskan lensa mata dan berpotongan di titik di depan retina">
${tree(50,112,1,'gr')}<line class="ln" x1="12" y1="150" x2="88" y2="150" stroke-width="1.2"/>
<ellipse cx="335" cy="105" rx="128" ry="88" fill="var(--card)" class="ln th"/>
<path class="ln th" d="M228 60Q190 105 228 150"/><path d="M228 60Q190 105 228 150Z" fill="var(--gls)" opacity=".6"/>
<ellipse cx="252" cy="105" rx="9" ry="30" fill="var(--wat)" class="ln"/>
<path d="M432 52Q472 105 432 158" fill="none" stroke="#dc2626" stroke-width="5"/>
<g class="dsh"><line x1="86" y1="76" x2="252" y2="92"/><line x1="86" y1="136" x2="252" y2="118"/><line x1="252" y1="92" x2="372" y2="105"/><line x1="252" y1="118" x2="372" y2="105"/><line x1="372" y1="105" x2="450" y2="113"/><line x1="372" y1="105" x2="450" y2="97"/></g>
<circle cx="372" cy="105" r="4" class="rd"/>
${lab(372,60,'Titik fokus','middle')}<line class="ln" x1="372" y1="66" x2="372" y2="98" stroke-width="1"/>
${lab(500,60,'Retina','end')}${lab(252,164,'Lensa','middle')}${lab(160,196,'Cornea','middle')}</svg>`;

/* Soal 20: jangka sorong, digambar dari nilai bacaan (cm, resolusi 0,01 cm) */
const cal=(v,t)=>{const s=Math.floor(v),u=60,X=x=>20+(x-s)*u,m=Math.round(v*100),k=m%10;
let o=`<svg viewBox="0 0 220 112" width="100%" role="img" aria-label="${t}"><rect class="bx" x="4" y="6" width="212" height="44"/><rect class="bx" x="4" y="50" width="212" height="52"/>`;
for(let i=0;i<=30;i++){const x=X(s+i/10),h=i%10?(i%5?7:12):18;o+=`<line class="ln" x1="${x}" y1="50" x2="${x}" y2="${50-h}" stroke-width="${i%10?1:1.5}"/>`;if(!(i%10))o+=`<text class="tx" x="${x}" y="24" text-anchor="middle">${s+i/10}</text>`}
for(let i=0;i<=10;i++){const x=X(v)+i*.09*u,h=i%5?7:12;o+=`<line class="ln${i==k?' rs':''}" x1="${x}" y1="50" x2="${x}" y2="${50+h}" ${i==k?'':'stroke-width="1"'}/>`;if(!(i%2))o+=`<text class="tx" font-size="9" x="${x}" y="${50+h+11}" text-anchor="middle">${i}</text>`}
return o+'</svg>'};
const R={z:.02,D:2.46,d:2.16,t:1.06};
const fig20=()=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px;width:100%">${[['Kondisi awal',R.z],['Diameter luar cincin',R.D],['Diameter dalam cincin',R.d],['Tebal cincin',R.t]].map(([n,v])=>`<div style="border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center">${cal(v,n)}<div style="font-size:.8rem;font-weight:600">${n}</div></div>`).join('')}</div>`;

/* Soal 21: grafik v–t */
const fig21=()=>`<svg viewBox="0 0 360 220" width="360" role="img" aria-label="Grafik kecepatan terhadap waktu: +10 m/s dari 0 sampai 4 s, lalu −10 m/s dari 4 sampai 8 s">
<line class="ln" x1="50" y1="110" x2="320" y2="110"/><line class="ln" x1="50" y1="200" x2="50" y2="24"/>
<polygon class="ink" points="320,105 331,110 320,115"/><polygon class="ink" points="45,24 50,13 55,24"/>
${lab(28,14,'v (m/s)')}${lab(336,128,'t (s)')}${lab(8,54,'+10')}${lab(8,174,'−10')}${lab(36,124,'0')}
<line class="dsh" x1="50" y1="50" x2="150" y2="50"/><line class="dsh" x1="50" y1="170" x2="150" y2="170"/><line class="dsh" x1="150" y1="50" x2="150" y2="170"/><line class="dsh" x1="250" y1="170" x2="250" y2="110"/>
<line class="ln th" x1="50" y1="50" x2="150" y2="50"/><line class="ln th" x1="150" y1="170" x2="250" y2="170"/>
<circle class="ink" cx="50" cy="50" r="3.5"/><circle class="ink" cx="150" cy="50" r="3.5"/><circle class="ink" cx="150" cy="170" r="3.5"/><circle class="ink" cx="250" cy="170" r="3.5"/>
${lab(150,206,'4','middle')}${lab(250,206,'8','middle')}</svg>`;

const mass=()=>{const D=R.D-R.z,d=R.d-R.z,t=R.t-R.z;return Math.PI/4*(D*D-d*d)*t*19.3};
const Q=[
{n:1,kind:'m',a:'Saat mencuci piring, Charli menumpuk dua buah gelas kaca yang bentuk dan ukurannya identik. Sesaat kemudian, ia mendapati kedua gelas tersebut macet dan saling menempel erat sehingga sulit ditarik lepas. Ia kemudian menuangkan air es ke dalam gelas bagian dalam, lalu merendam bagian bawah gelas terluar ke dalam mangkuk berisi air hangat. Hanya dalam beberapa detik, kedua gelas tersebut bergeser dengan sendirinya dan sangat mudah dipisahkan.',b:'Berdasarkan peristiwa tersebut, tentukan mana saja pernyataan yang bernilai <b>BENAR</b>! Jawaban <b>BENAR</b> lebih dari satu.',o:['Gelas bagian dalam yang bersentuhan dengan air es akan melepaskan kalor sehingga mengalami penyusutan dan ukurannya sedikit mengecil.','Gelas bagian luar yang direndam air hangat akan menerima kalor sehingga mengalami pemuaian dan diameter rongganya sedikit membesar.','Jika trik Charli dibalik (air hangat diisikan ke gelas dalam, sedangkan air es untuk merendam gelas luar), kedua gelas akan makin longgar karena efek pelumasan.','Kalor yang diserap oleh gelas luar menyebabkan atom-atom penyusun kaca bergetar lebih cepat sehingga jarak antaratomnya sedikit meregang.','Proses pemuaian pada gelas bagian luar akan membuat massa gelas tersebut ikut bertambah, sehingga gravitasi menariknya lepas ke bawah.'],key:[1,1,0,1,0],why:'(1), (2), (4) benar. (3) salah: kalau dibalik, gelas dalam memuai dan gelas luar menyusut sehingga makin menjepit. (5) salah: pemuaian tidak mengubah massa.'},
{n:2,kind:'s',a:'Hosana memasukkan sebuah kaleng aluminium berisi minuman soda dan sebuah kotak plastik berisi roti isi ke dalam sebuah kotak pendingin (<i>cooler box</i>) yang sudah diisi penuh dengan es batu. Kaleng aluminium dan kotak plastik tersebut telah berada di dalam sana cukup lama. Kemudian Hosana mengeluarkan keduanya dari <i>cooler box</i> dan menempelkan kaleng aluminium secara langsung dengan kotak plastik.',b:'Kesimpulan yang tepat mengenai keadaan kaleng aluminium dan kotak plastik tersebut saat saling bersentuhan adalah ....',o:['Kaleng aluminium akan mengalirkan kalor ke kotak plastik karena sifat logam yang merupakan konduktor panas yang lebih baik.','Kaleng aluminium dan kotak plastik berada pada suhu yang persis sama, sehingga tidak ada perpindahan kalor di antara keduanya.','Kotak plastik akan menyerap suhu dingin dari kaleng aluminium karena kapasitas kalor plastik lebih besar dibandingkan logam.','Kaleng aluminium bersuhu lebih rendah dari kotak plastik karena material logam lebih cepat menyerap suhu dingin dari es batu.','Keduanya akan terus bertukar kalor secara aktif dengan udara di dalam kotak pendingin hingga salah satu benda tersebut membeku.'],key:1,why:'Setelah cukup lama di dalam es, keduanya mencapai kesetimbangan termal pada suhu yang sama. Logam terasa lebih dingin hanya karena konduktivitasnya tinggi, bukan karena suhunya lebih rendah.'},
{n:3,kind:'t',h:['TEPAT','TIDAK TEPAT'],a:'Sebuah mesin sepeda motor pada dasarnya beroperasi sebagai mesin kalor. Mesin kalor bekerja dengan menyerap panas dari reservoir bersuhu tinggi (ruang bakar silinder), mengubah sebagian panas tersebut menjadi usaha mekanik (putaran mesin), dan membuang sisa panas yang tidak terpakai ke reservoir bersuhu rendah (udara lingkungan melalui knalpot). Seorang montir berencana melakukan modifikasi pada sepeda motornya agar efisiensi bahan bakarnya meningkat. Ia ingin persentase panas yang berhasil diubah menjadi energi gerak menjadi lebih maksimal. Lalu, ia menyusun tiga rencana modifikasi termodinamika.',b:'Berdasarkan informasi di atas, evaluasi dan tentukan apakah setiap rencana modifikasi berikut <b>TEPAT</b> atau <b>TIDAK TEPAT</b> dalam meningkatkan efisiensi mesin sepeda motornya!',o:['Mengganti jenis bahan bakar agar mampu menghasilkan suhu ledakan pembakaran yang lebih tinggi di dalam silinder, dengan asumsi suhu pembuangan ke lingkungan tetap.','Memodifikasi saluran pembuangan dengan pelepas panas tambahan sehingga suhu gas buang sisa menjadi lebih rendah sebelum bersentuhan dengan lingkungan.','Menyetel ulang mesin untuk menurunkan suhu pembakaran di dalam silinder, karena sang montir meyakini mesin yang beroperasi pada suhu yang lebih dingin pasti bekerja lebih efisien.'],key:[1,1,0],why:'Efisiensi ideal η = 1 − T<sub>rendah</sub>/T<sub>tinggi</sub>. Menaikkan T<sub>tinggi</sub> atau menurunkan T<sub>rendah</sub> menaikkan efisiensi; menurunkan suhu pembakaran justru menurunkannya.'},
{n:4,kind:'s',a:'Seorang videografer sedang memprogram sebuah <i>drone</i> jenis <i>quadcopter</i> (<i>drone</i> dengan empat baling-baling) untuk proyek videografinya. Agar <i>drone</i> bisa melayang diam di udara tanpa berputar tak terkendali, <i>drone</i> didesain agar memiliki arah putaran baling-baling secara khusus: dua baling-baling menyilang berputar searah jarum jam dan dua baling-baling menyilang lainnya berputar berlawanan arah jarum jam. Dalam keadaan melayang stabil, total momentum sudut keempat baling-baling tersebut saling meniadakan. Suatu saat, <i>drone</i> sedang melayang diam pada ketinggian tetap tertentu. Sang videografer ingin memutar kamera <i>drone</i> ke arah kiri tanpa membuat <i>drone</i> tersebut naik, turun, atau miring. Ia harus memberikan perintah ke komputer <i>drone</i> untuk memanipulasi kecepatan putar motor baling-balingnya.',b:'Perintah teknis yang tepat untuk dieksekusi oleh komputer <i>drone</i> tersebut adalah ....',o:['Mempercepat putaran keempat baling-baling secara bersamaan dan merata agar menghasilkan tambahan gaya torsi ke arah kiri.','Mempercepat putaran dua baling-baling yang berputar searah jarum jam, sekaligus memperlambat putaran dua baling-baling yang berputar berlawanan arah jarum jam dengan porsi yang sama.','Memperlambat putaran dua baling-baling yang berputar searah jarum jam, sekaligus mempercepat putaran dua baling-baling yang berputar berlawanan arah jarum jam dengan porsi yang sama.','Mematikan sementara dua baling-baling yang berputar searah jarum jam, sehingga sistem murni dikendalikan oleh momentum sudut dari baling-baling yang berputar berlawanan arah jarum jam.','Mempercepat dua baling-baling di sisi kanan <i>drone</i> dan memperlambat dua baling-baling di sisi kiri <i>drone</i>.'],key:1,why:'Baling-baling yang makin cepat berputar searah jarum jam memberi torsi reaksi berlawanan arah jarum jam (ke kiri) pada badan <i>drone</i>. Dengan memperlambat pasangan lainnya sama besar, gaya angkat total tetap dan tidak ada kemiringan.'},
{n:5,kind:'s',a:'Devano sering kali tidak sengaja menjatuhkan gawainya (<i>smartphone</i>) dari meja ke lantai keramik. Untuk melindungi gawainya, ia mengganti <i>casing</i> (pelindung) berbahan plastik kaku yang keras dengan pelindung berbahan silikon karet yang tebal dan empuk. Benar saja, saat terjatuh lagi dari ketinggian yang sama, gawai dengan <i>casing</i> silikon tersebut tetap aman dan layarnya tidak retak, berbeda dengan pelindung plastik kaku yang sering kali membuat layar ikut pecah.',b:'Alasan utama mengapa <i>casing</i> berbahan silikon karet lebih efektif melindungi gawai dibandingkan <i>casing</i> plastik kaku adalah ....',o:['<i>Casing</i> silikon menyerap sebagian besar kecepatan gawai sebelum menyentuh lantai, sehingga percepatan jatuh gawai menjadi lebih lambat dari biasanya.','<i>Casing</i> silikon membuat gawai berhenti secara instan di lantai, mencegah adanya pergerakan sisa yang bisa merambat dan meretakkan kaca layar gawai.','<i>Casing</i> silikon menghasilkan nilai impuls yang lebih besar daripada <i>casing</i> plastik, sehingga seluruh gaya pantul dari lantai bisa diredam sepenuhnya.','<i>Casing</i> silikon memperpanjang waktu sentuh gawai dengan lantai saat tumbukan, sehingga gaya benturan rata-rata menjadi jauh lebih kecil.','<i>Casing</i> silikon mampu memperkecil total perubahan momentum gawai saat membentur lantai, sehingga efek kerusakan pada layar bisa dihindari.'],key:3,why:'Impuls F·Δt = Δp sama untuk ketinggian jatuh yang sama. Δt yang lebih panjang membuat gaya rata-rata F lebih kecil.'},
{n:6,kind:'s',a:'Saat pertandingan sepak bola berlangsung, seorang pemain melepaskan tendangan bebas melambung melewati pagar betis lawan menuju gawang. Bola melesat ke udara membentuk lintasan parabola sebelum akhirnya jatuh kembali ke tanah. Sepanjang pergerakan bola di udara, gesekan udara dapat diabaikan sehingga bola murni bergerak di bawah pengaruh tarikan gravitasi bumi.',b:'Penjelasan yang paling tepat mengenai keadaan gerak bola saat tepat berada di titik tertinggi lintasannya adalah ....',o:['Kecepatan vertikal dan percepatannya bernilai nol, sehingga bola hanya melaju karena sisa dorongan tendangan.','Kecepatan total bola berbalik arah secara mendadak ke bawah, dan percepatan gravitasi bumi sempat menghilang.','Kecepatan mendatar bola bernilai nol sedangkan kecepatan tegaknya maksimum, dengan percepatan terus ke arah depan.','Kecepatan total bola menjadi nol karena berhenti sesaat di udara, dan percepatan yang dialami juga bernilai nol.','Kecepatan vertikal bola bernilai nol tetapi kecepatan mendatarnya tetap ada, dengan percepatan tetap ke arah bawah.'],key:4,why:'Di titik tertinggi <i>v<sub>y</sub></i> = 0, <i>v<sub>x</sub></i> konstan (tanpa gesekan), dan percepatan tetap <i>g</i> ke bawah.'},
{n:7,kind:'m',a:'Truk pemuat barang yang sangat berat selalu dilengkapi dengan setir yang diameternya jauh lebih besar dibandingkan dengan setir mobil balap. Desain ini bukan tanpa alasan. Ukuran setir sangat memengaruhi seberapa besar efek putaran yang bisa dihasilkan oleh tangan pengemudi untuk membelokkan ban yang berat. Di bagian dalam mesin kendaraan tersebut, terdapat sebuah komponen baja berputar yang disebut roda gila (<i>flywheel</i>). Roda gila ini sengaja didesain sedemikian rupa sehingga sebagian besar bongkahan logamnya difokuskan pada bagian tepi luar (menjauhi poros tengah). Desain ini memanfaatkan konsep momen inersia untuk menjaga agar putaran mesin tetap stabil dan tidak mudah terhenti secara mendadak saat terjadi perubahan kecepatan.',b:'Berdasarkan informasi tersebut, tentukan mana saja pernyataan yang bernilai <b>BENAR</b>! Jawaban <b>BENAR</b> lebih dari satu.',o:['Setir truk didesain dengan diameter yang besar agar pengemudi dapat menghasilkan momen gaya yang lebih besar tanpa harus mengeluarkan gaya otot yang berlebihan.','Momen inersia sebuah roda atau setir putar hanya ditentukan oleh berat total benda tersebut saja, tanpa dipengaruhi oleh seberapa besar ukuran diameternya.','Jika pengemudi memberikan gaya dorong pada setir dengan arah yang persis lurus menuju ke pusat poros setir, setir akan sangat mudah berputar karena momen gayanya mencapai nilai maksimal.','Roda gila (<i>flywheel</i>) pada mesin yang massanya difokuskan di bagian tepi luar akan memiliki momen inersia yang lebih besar, sehingga kelembamannya untuk mempertahankan putaran juga membesar.','Jarak tegak lurus dari pusat poros kemudi ke posisi tangan pengemudi disebut sebagai lengan momen, yang berfungsi menentukan seberapa efektif gaya tersebut menghasilkan putaran.'],key:[1,0,0,1,1],why:'(1), (4), (5) benar. (2) salah: <i>I</i> = Σ<i>mr</i><sup>2</sup> bergantung pada distribusi massa dan jarak ke poros. (3) salah: gaya menuju poros memiliki lengan nol sehingga momen gayanya nol.'},
{n:8,kind:'m',a:'Petugas pemadam kebakaran menggunakan pompa untuk mengalirkan air melalui selang menuju sebuah gedung yang terbakar. Selang tersebut memiliki bagian utama yang lebih lebar dan berakhir pada nosel yang lebih sempit. Pada suatu kondisi, air mengalir melalui bagian utama selang yang memiliki luas penampang 6 cm<sup>2</sup> dengan kelajuan 2 m/s. Air kemudian keluar melalui nosel yang memiliki luas penampang 2 cm<sup>2</sup>. Kedua bagian selang yang diamati berada pada ketinggian yang sama. Jika massa jenis air 1.000 kg/m<sup>3</sup> dan gesekan di dalam selang diabaikan.',b:'Berdasarkan informasi di atas, pilihlah semua pernyataan yang <b>BENAR</b>! Pernyataan <b>BENAR</b> lebih dari satu.',o:['Kelajuan air saat keluar dari nosel adalah 60 cm/s.','Tekanan air di bagian utama selang lebih besar 16.000 Pa daripada di nosel.','Debit air pada bagian utama selang adalah 1,2 × 10<sup>−3</sup> m<sup>3</sup>/s, sedangkan debit pada nosel adalah 4 × 10<sup>−4</sup> m<sup>3</sup>/s.','Volume air yang melewati bagian utama selang dalam waktu 5 sekon adalah 6 × 10<sup>−3</sup> m<sup>3</sup>.','Jika luas penampang nosel diperkecil lagi, jangkauan horizontal air akan makin jauh.'],key:[0,1,0,1,1],why:'<i>Q</i> = 6×10<sup>−4</sup> · 2 = 1,2×10<sup>−3</sup> m³/s di mana saja, sehingga <i>v</i> nosel = 6 m/s (1 salah, 3 salah). ΔP = ½ρ(6² − 2²) = 16.000 Pa (2 benar). <i>V</i> = 1,2×10<sup>−3</sup> · 5 = 6×10<sup>−3</sup> m³ (4 benar). (5) benar dengan debit tetap: nosel lebih kecil membuat <i>v</i> keluar lebih besar sehingga jangkauan bertambah.'},
{n:9,kind:'s',a:'Dalam suatu percobaan untuk menentukan cepat rambat bunyi di udara, sebuah tabung yang terbuka di bagian atas diisi dengan air. Sebuah garpu tala yang bergetar dipegang di atas tabung ketika air dikeluarkan melalui sebuah katup.',fig:fig9,b:'Bunyi terdengar lebih kuat untuk pertama kalinya ketika panjang kolom udara adalah <i>x</i>. Bunyi terdengar lebih kuat berikutnya ketika panjang kolom udara adalah <i>y</i>. Panjang gelombang bunyi tersebut jika dinyatakan dalam <i>x</i> dan <i>y</i> berturut-turut adalah ....',o:['4<i>x</i> dan 4<i>y</i>','2<i>x</i> dan 2<i>y</i>','2<i>x</i> dan 4<i>y</i>/3','4<i>x</i> dan 4<i>y</i>/3','4<i>x</i> dan 2<i>y</i>/3'],key:3,why:'Resonansi pertama terjadi pada ¼λ = <i>x</i>, jadi λ = 4<i>x</i>. Resonansi berikutnya pada ¾λ = <i>y</i>, jadi λ = 4<i>y</i>/3.'},
{n:10,kind:'s',a:'Sebuah bola kecil bermassa 2,0 × 10<sup>−4</sup> kg diberi muatan listrik dan digantung menggunakan benang plastik di dekat generator Van de Graaff, seperti ditunjukkan pada gambar.',fig:fig10,b:'Bola menyimpang sehingga benang membentuk sudut 45° terhadap arah vertikal. Jika besar medan listrik pada posisi tersebut 1,0 × 10<sup>4</sup> N/C dan percepatan gravitasi <i>g</i> = 10 m/s<sup>2</sup>, besar muatan listrik pada bola tersebut adalah ....',o:['0,5 × 10<sup>−7</sup> C','1,0 × 10<sup>−7</sup> C','2,0 × 10<sup>−7</sup> C','1,0 × 10<sup>−6</sup> C','2,0 × 10<sup>−6</sup> C'],key:2,why:'Setimbang: tan 45° = <i>qE</i>/<i>mg</i> = 1, sehingga <i>q</i> = <i>mg</i>/<i>E</i> = (2,0 × 10<sup>−4</sup>)(10)/(1,0 × 10<sup>4</sup>) = 2,0 × 10<sup>−7</sup> C.'},
{n:11,kind:'t',a:'Osara menyadari sebuah pola yang aneh pada lampu pijar (bohlam dengan kawat filamen) di gudang rumahnya. Lampu tersebut hampir selalu putus atau terbakar tepat pada detik pertama sakelar ditekan, bukan ketika lampu sudah menyala berjam-jam. Osara kemudian mencari tahu hubungan antara suhu kawat filamen logam di dalam bohlam tersebut dengan kemampuan kawat menahan aliran arus listrik.',b:'Berdasarkan teks di atas, evaluasi dan tentukan apakah setiap pernyataan berikut bernilai <b>BENAR</b> atau <b>SALAH</b>!',o:['Saat lampu pijar dalam keadaan mati dan bersuhu dingin, nilai hambatan listrik pada kawat filamennya lebih kecil dibandingkan saat lampu sudah menyala dan menjadi panas.','Panas yang dihasilkan lampu membuat atom-atom logam di dalam kawat filamen berhenti bergetar, sehingga elektron arus listrik dapat mengalir lebih lancar dan hambatan filamen menurun drastis.','Karena hambatan kawat masih sangat kecil saat dingin, terjadi lonjakan arus listrik yang sangat besar di sepersekian detik pertama saat sakelar ditekan, dan lonjakan inilah yang sering membuat kawat filamen putus.'],key:[1,0,1],why:'Hambatan logam naik seiring suhu karena getaran atom makin kuat (bukan berhenti), sehingga hambatan dingin kecil dan arus awal besar (<i>I</i> = <i>V</i>/<i>R</i>).'},
{n:12,kind:'s',a:'Sebuah berkas cahaya monokromatik merambat dari air menuju udara. Ketika melewati batas kedua medium, arah rambat cahaya dapat berubah akibat perbedaan indeks bias air dan udara.',b:'Anggap indeks bias air lebih besar daripada indeks bias udara, perubahan cepat rambat dan panjang gelombang cahaya setelah memasuki udara adalah ....',o:['Cepat rambat cahaya dan panjang gelombang bertambah.','Cepat rambat cahaya bertambah dan panjang gelombang berkurang.','Cepat rambat cahaya berkurang dan panjang gelombang bertambah.','Cepat rambat cahaya dan panjang gelombang berkurang.','Cepat rambat cahaya tetap dan panjang gelombang bertambah.'],key:0,why:'<i>v</i> = <i>c</i>/<i>n</i>: indeks bias udara lebih kecil sehingga <i>v</i> naik. Frekuensi tetap, maka λ = <i>v</i>/<i>f</i> ikut naik.'},
{n:13,kind:'s',a:'Perhatikan diagram pembentukan bayangan pada mata berikut!',fig:fig13,b:'Pada diagram, berkas cahaya dari suatu benda memasuki mata dan dibiaskan oleh sistem optik mata. Bayangan dari benda tersebut difokuskan di depan retina, sehingga objek tampak kabur. Berdasarkan kondisi tersebut, gangguan mata yang dialami dan jenis lensa yang tepat untuk mengoreksinya adalah ....',o:['Hipermetropia, dikoreksi dengan lensa cembung.','Hipermetropia, dikoreksi dengan lensa cekung.','Presbiopia, dikoreksi dengan lensa silinder.','Miopia, dikoreksi dengan lensa cembung.','Miopia, dikoreksi dengan lensa cekung.'],key:4,why:'Bayangan jatuh di depan retina berarti mata rabun jauh (miopia). Lensa cekung (divergen) menyebarkan berkas sehingga bayangan bergeser mundur tepat ke retina.'},
{n:14,kind:'t',a:'Di banyak rumah, toren (tangki penampung air) menggunakan teknologi katup pelampung mekanis yang umumnya terbuat dari bola plastik berongga. Teknologi ini mengandalkan Hukum Archimedes: saat volume cairan di dalam toren naik, cairan memberikan gaya dorong ke atas pada bola pelampung. Gaya apung ini kemudian mengangkat tuas yang terhubung ke katup keran. Saat air mencapai batas maksimal, dorongan tuas tersebut akan menutup keran secara otomatis sehingga air tidak meluber. Seorang petani hidroponik ingin menggunakan sistem katup pelampung toren ini untuk tangki penyimpanan larutan nutrisi pupuk cair, yang massa jenisnya lebih besar dari air bersih. Di samping itu, sang petani sedang mengevaluasi beberapa rencana modifikasi pada fisik bola pelampungnya agar sesuai dengan rancangan tangki di perkebunannya.',b:'Berdasarkan informasi di atas, evaluasi dan tentukan apakah setiap pernyataan analisis berikut bernilai <b>BENAR</b> atau <b>SALAH</b>!',o:['Jika katup pelampung asli dipakai pada cairan pupuk yang lebih pekat, keran akan tertutup pada saat ketinggian permukaan cairan lebih rendah dibandingkan saat menggunakan air bersih.','Jika bola pelampung berongga diganti dengan bola pejal yang jauh lebih berat namun ukuran volumenya persis sama, gaya apung maksimal yang dapat dihasilkan oleh cairan akan berkurang, sehingga katup gagal menutup.','Jika bola pelampung sengaja diisi sedikit pasir di dalamnya, pelampung tersebut harus tercelup lebih dalam ke dalam cairan untuk bisa menghasilkan gaya apung yang cukup kuat mengangkat tuas keran.'],key:[1,0,1],why:'<i>F<sub>A</sub></i> = ρ<i>gV</i><sub>tercelup</sub>. (1) Cairan lebih rapat butuh volume tercelup lebih kecil, jadi keran menutup di permukaan lebih rendah. (2) Gaya apung maksimum hanya bergantung pada volume dan massa jenis cairan, tidak pada berat bola; yang berubah adalah gaya angkat bersihnya. (3) Pelampung lebih berat harus tercelup lebih dalam.'},
{n:15,kind:'s',a:'Sebuah kaleng tembaga bermassa 50 g berisi 100 g air, keduanya bersuhu 80°C. Sebuah balok tembaga bermassa 100 g dan bersuhu 435°C dimasukkan ke dalam kaleng. Kaleng terisolasi dari lingkungan. Setelah beberapa saat, suhu kaleng dan isinya mencapai 100°C dan sebagian air berubah menjadi uap.<br>Diketahui: kalor jenis tembaga = 400 J.kg<sup>−1</sup>K<sup>−1</sup>; kalor jenis air = 4.200 J.kg<sup>−1</sup>K<sup>−1</sup>; kalor laten penguapan air = 2,3 × 10<sup>6</sup> J.kg<sup>−1</sup>.',b:'Massa maksimum air yang dapat berubah menjadi uap adalah sebesar ....',o:['2,0 gram','2,2 gram','4,0 gram','5,8 gram','8,0 gram'],key:0,why:'Kalor dilepas balok: 0,1·400·335 = 13.400 J. Kaleng: 0,05·400·20 = 400 J. Air: 0,1·4.200·20 = 8.400 J. Sisa 4.600 J untuk menguapkan <i>m</i> = 4.600/2,3×10<sup>6</sup> = 2,0 g.'},
{n:16,kind:'s',a:'Dua orang pekerja bangunan sedang mengecat dinding luar sebuah gedung bertingkat. Mereka berdiri di atas sebuah papan gondola yang digantung tinggi oleh dua utas tali baja di ujung kiri dan kanannya. Pada awalnya, salah satu pekerja berdiri di ujung papan tepat di dekat titik ikat tali sebelah kiri. Namun, untuk mengecat area yang lain, ia berjalan pelan menjauhi tali kiri tersebut menuju ke bagian tengah papan gondola.',b:'Nama jenis gaya yang bekerja pada tali baja tersebut dan analisis yang tepat mengenai perubahan pada gaya tersebut saat pekerja mulai berjalan menuju ke tengah papan gondola adalah ....',o:['Gaya tegangan tali, gayanya makin bertambah karena tali kiri harus menarik pekerja agar tidak jatuh ke bawah.','Gaya tegangan tali, gayanya makin berkurang karena tali kiri kini menanggung porsi beban yang lebih sedikit.','Gaya normal, gayanya makin bertambah karena tali kiri harus merespons pusat massa pekerja yang bergeser.','Gaya gesek statis, gayanya tetap konstan karena berat total dari pekerja dan papan perancah tidak berubah.','Gaya berat, gayanya makin berkurang karena gravitasi Bumi terdistribusi merata saat pekerja di tengah.'],key:1,why:'Gaya pada tali adalah tegangan. Momen terhadap ujung kanan: makin jauh pekerja dari tali kiri, makin kecil tegangan tali kiri (dan makin besar tegangan tali kanan).'},
{n:17,kind:'s',a:'Sebuah rumah sakit baru saja memasang lift yang dilengkapi sensor lantai untuk mencegah kelebihan muatan. Batas aman muatan diatur secara ketat pada angka 800 kg. Suatu hari, beberapa perawat dan ranjang pasien masuk ke dalam lift. Saat lift masih diam dan pintu tertutup, layar sensor menunjukkan angka aman: 780 kg. Namun, tepat ketika lift mulai bergerak naik, alarm tanda bahaya (indikator <i>overload</i>) tiba-tiba berbunyi nyaring selama dua detik. Anehnya, setelah dua detik berlalu dan lift terus bergerak naik dengan kecepatan yang sudah stabil, alarm tersebut mati dengan sendirinya dan angka di layar kembali menunjukkan 780 kg.',b:'Berdasarkan kejadian tersebut, manakah penjelasan penyebab yang paling tepat dan solusi teknis terbaik untuk diterapkan oleh insinyur lift?',o:['Tali baja bergerak murni karena gaya aksi-reaksi dengan atap lift tanpa memengaruhi lantai, teknisi harus memindahkan sensor dari lantai ke atap agar terhindar dari tekanan kaki penumpang.','Sepatu penumpang memberikan gaya gesek statis yang kuat ke lantai saat ditarik ke atas, teknisi harus melapisi lantai lift dengan bahan licin agar sensor tidak membaca gaya gesek tersebut sebagai beban.','Kecepatan lift yang mendadak tinggi membuat massa total penumpang bertambah selama beberapa detik, teknisi harus menaikkan batas aman alarm menjadi jauh lebih tinggi dari kapasitas normal tali baja.','Gaya gravitasi Bumi pada tubuh penumpang meningkat sesaat akibat tarikan kabel baja ke atas, teknisi harus mengganti sensor gaya dengan sensor volume agar tidak terpengaruh oleh pergerakan lift.','Lantai lift memberikan gaya tumpu ekstra untuk menghasilkan percepatan ke atas pada penumpang, teknisi harus memprogram sensor agar menunda pembacaan beban saat lift sedang mengalami percepatan.'],key:4,why:'Saat lift mempercepat ke atas, <i>N</i> = <i>m</i>(<i>g</i> + <i>a</i>) lebih besar dari berat diam sehingga sensor membaca beban lebih besar. Setelah kecepatan konstan, <i>N</i> = <i>mg</i> kembali. Massa dan gravitasi tidak berubah.'},
{n:18,kind:'s',a:'Kei dan Revi sedang memikul sebuah kotak pendingin (<i>cooler box</i>) berisi air minum yang cukup berat. Mereka menggunakan sebatang tongkat kayu yang ditumpukan pada bahu masing-masing. Kei berjalan di depan dan Revi di belakang. Awalnya, kotak tersebut digantungkan tepat di tengah-tengah tongkat, sehingga keduanya merasakan beban tarikan yang sama berat di bahu mereka. Di tengah perjalanan, tali pengikat kotak tersebut sedikit longgar sehingga kotaknya bergeser mundur mendekati bahu Revi. Menyadari hal itu, mereka tetap berjalan dan mempertahankan tongkat agar tetap pada posisi mendatar (seimbang).',b:'Pernyataan yang paling tepat mengenai gaya tumpu yang dirasakan Kei dan Revi adalah ....',o:['Kei menahan beban lebih besar dari Revi. Jarak kotak ke bahu Kei lebih pendek, sehingga Kei butuh gaya lebih besar untuk menyeimbangkan sistem.','Revi menahan beban lebih besar dari Kei. Jarak bahu Revi lebih dekat ke kotak, sehingga ia butuh gaya tumpu lebih besar untuk menyeimbangkan sistem.','Keduanya tetap menahan beban yang sama besar seperti semula, karena berat total kotak pendingin maupun panjang tongkat kayu tidak pernah berubah.','Keduanya menahan beban yang jauh lebih berat dari sebelumnya, karena pergeseran letak kotak menghasilkan momen gaya tambahan yang merusak sistem.','Revi menahan beban lebih ringan dari Kei. Karena kotak mendekati bahu Revi, sebagian besar tarikan gravitasi dinetralkan oleh poros tongkat kayu.'],key:1,why:'Momen terhadap bahu Kei: <i>N<sub>R</sub></i>·<i>L</i> = <i>W</i>·<i>d</i>. Makin dekat kotak ke Revi (<i>d</i> makin besar dari bahu Kei), makin besar <i>N<sub>R</sub></i>, sedangkan <i>N<sub>K</sub></i> + <i>N<sub>R</sub></i> = <i>W</i> tetap.'},
{n:19,kind:'s',a:'Seorang astronot sedang melakukan perbaikan di luar stasiun luar angkasa. Tiba-tiba, tali pengamannya putus dan alat pendorong pada baju pelindungnya mengalami kerusakan. Ia kini terjebak dalam keadaan diam melayang di ruang hampa, beberapa meter dari pintu masuk stasiun. Karena tidak ada pijakan atau udara di sekitarnya, ia tidak bisa berenang atau berjalan di udara. Untungnya, ia masih memegang sebuah kunci pas baja yang cukup berat di tangannya.',b:'Tindakan yang paling tepat dilakukan oleh astronot tersebut agar ia bisa kembali ke pintu stasiun adalah ....',o:['Melempar kunci pas tersebut sekuat tenaga ke arah stasiun, sehingga efek aerodinamisnya akan menarik tubuhnya mengikuti kunci.','Mengayunkan kunci pas berputar di atas kepalanya secara terus-menerus untuk menciptakan daya dorong layaknya baling-baling helikopter.','Melempar kunci pas tersebut sekuat tenaga ke arah yang menjauhi stasiun, sehingga tubuhnya akan menerima dorongan ke arah stasiun.','Melepaskan kunci pas tersebut perlahan di ruang hampa, karena murni pengurangan massa yang akan membuat tubuhnya bergerak ke stasiun.','Menekan kunci pas tersebut erat-erat ke dadanya untuk menciptakan gaya dorong yang berasal dari reaksi internal kontraksi otot tubuhnya.'],key:2,why:'Kekekalan momentum dan hukum III Newton: melempar kunci menjauhi stasiun memberi astronot momentum ke arah stasiun. Di ruang hampa tidak ada udara untuk efek aerodinamis atau baling-baling.'},
{n:20,kind:'s',a:'Seorang pegawai toko perhiasan ingin menentukan massa sebuah cincin emas menggunakan konsep massa jenis. Ia mengukur diameter luar, diameter dalam, dan ketebalan cincin menggunakan jangka sorong (satuan cm) dengan hasil pembacaan sebagai berikut:',fig:fig20,b:'Jika acuan nilai massa jenis emas yang digunakan 19,3 g/cm<sup>3</sup>, massa cincin emas tersebut adalah ....',o:['21,0 g','21,7 g','22,8 g','23,7 g','24,0 g'],key:1,why:()=>`Koreksi galat nol ${R.z.toFixed(2)} cm: D = ${(R.D-R.z).toFixed(2)} cm, d = ${(R.d-R.z).toFixed(2)} cm, t = ${(R.t-R.z).toFixed(2)} cm. Massa = ρ · ¼π(D² − d²) · t ≈ ${mass().toFixed(1).replace('.',',')} g.`},
{n:21,kind:'t',a:'Sebuah mobil mainan sedang bergerak pada lintasan lurus mendatar. Kecepatan mobil mainan terhadap waktu disajikan oleh grafik berikut.',fig:fig21,b:'Berdasarkan grafik di atas, tentukan apakah setiap pernyataan berikut bernilai <b>BENAR</b> atau <b>SALAH</b>!',o:['Pada interval <i>t</i> = 4 s hingga <i>t</i> = 8 s, mobil mengalami gerak diperlambat.','Besar perpindahan mobil setelah bergerak selama 8 detik adalah 0 meter.','Jarak total yang ditempuh mobil selama 8 detik adalah 80 meter.','Besar percepatan mobil saat detik ke-4 adalah −2,5 m/s<sup>2</sup>'],key:[0,1,1,0],why:'(1) Salah: kecepatan konstan −10 m/s, jadi percepatan nol. (2) Benar: +40 m + (−40 m) = 0. (3) Benar: 40 m + 40 m = 80 m. (4) Salah: −2,5 m/s² hanyalah Δ<i>v</i>/Δ<i>t</i> rata-rata selama 8 s; di tiap interval <i>a</i> = 0 dan pada detik ke-4 kecepatan berubah seketika.'}];

const A=Q.map(q=>q.kind=='s'?null:q.o.map(()=>q.kind=='t'?null:0)),C=Q.map(()=>false);
$('#qs').innerHTML=Q.map((q,i)=>`<section class="card" id="c${i}"><div class="hd"><b>Soal ${q.n}</b><span class="tag">${q.kind=='t'?'Benar / Salah':q.kind=='m'?'Pilih semua yang benar':'Pilihan ganda'}</span></div><p>${q.a}</p>${q.fig?`<figure>${q.fig()}</figure>`:''}<p>${q.b}</p>`+
(q.kind!='t'?q.o.map((o,j)=>`<label class="op"><input type="${q.kind=='m'?'checkbox':'radio'}" name="q${i}${q.kind=='m'?'_'+j:''}" value="${j}"><i>${q.kind=='m'?j+1:L[j]}</i><span>${o}</span></label>`).join(''):
`<div class="tw"><table><thead><tr><th>PERNYATAAN</th><th>${(q.h||['BENAR','SALAH'])[0]}</th><th>${(q.h||['BENAR','SALAH'])[1]}</th></tr></thead><tbody>${q.o.map((o,k)=>`<tr><td>${k+1}. ${o}</td><td><input type="radio" name="q${i}_${k}" value="1" aria-label="Benar"></td><td><input type="radio" name="q${i}_${k}" value="0" aria-label="Salah"></td></tr>`).join('')}</tbody></table></div>`)+
`<div class="row"><button data-c="${i}" disabled>Periksa</button><span class="res" id="r${i}"></span></div><div class="why" id="w${i}"></div></section>`).join('');
$('#nav').innerHTML=Q.map((q,i)=>`<a href="#c${i}" id="n${i}">${q.n}</a>`).join('');

const done=i=>Q[i].kind=='s'?A[i]!==null:Q[i].kind=='m'?A[i].some(x=>x):A[i].every(x=>x!==null);
const right=i=>Q[i].kind=='s'?A[i]===Q[i].key:A[i].every((x,k)=>x===Q[i].key[k]);
function upd(){let n=0;Q.forEach((q,i)=>{if(done(i))n++;const b=document.querySelector(`[data-c="${i}"]`);b.disabled=!done(i)||C[i];const a=$('#n'+i);a.className=C[i]?(right(i)?'ok':'bad'):done(i)?'done':''});
$('#pb').style.width=n/Q.length*100+'%';const k=C.filter(Boolean).length;$('#sc').textContent=k?`Skor ${Q.filter((_,i)=>C[i]&&right(i)).length}/${Q.length}`:`${n}/${Q.length} terjawab`}
function check(i){if(!done(i))return;C[i]=true;const c=$('#c'+i),q=Q[i];c.classList.add('checked');c.querySelectorAll('input').forEach(x=>x.disabled=true);
if(q.kind=='m')c.querySelectorAll('.op').forEach((l,j)=>{if(q.key[j])l.classList.add('ok');else if(A[i][j])l.classList.add('bad')});else if(q.kind=='s')c.querySelectorAll('.op').forEach((l,j)=>{if(j==q.key)l.classList.add('ok');else if(j==A[i])l.classList.add('bad')});
else c.querySelectorAll('tbody tr').forEach((r,k)=>r.classList.add(A[i][k]===q.key[k]?'ok':'bad'));
const r=$('#r'+i),ok=right(i);r.textContent=ok?'Benar ✓':q.kind=='s'?`Kunci: ${L[q.key]}`:'Ada yang keliru';r.className='res '+(ok?'ok':'bad');
$('#w'+i).innerHTML='<b>Pembahasan.</b> '+(typeof q.why=='function'?q.why():q.why);upd()}
document.addEventListener('change',e=>{const m=e.target.name&&e.target.name.match(/^q(\d+)(?:_(\d+))?$/);if(!m)return;const i=+m[1],v=e.target.type=='checkbox'?+e.target.checked:+e.target.value;if(m[2]===undefined)A[i]=v;else A[i][+m[2]]=v;upd()});
document.addEventListener('click',e=>{if(e.target.dataset.c)check(+e.target.dataset.c)});
$('#all').onclick=()=>{Q.forEach((_,i)=>{if(!C[i])check(i)});upd()};
$('#rst').onclick=()=>location.reload();
upd();
</script>
</body>
</html>
