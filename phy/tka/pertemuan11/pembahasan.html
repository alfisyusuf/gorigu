      `Hukum Kirchhoff: I<sub>L1</sub> = I<sub>L2</sub> + I<sub>L3</sub>. Pernyataan 3 <b>benar</b>.`,
      `R paralel = R/2. R total = R + R/2 = 1,5R. Pernyataan 4 <b>benar</b>.`,
      `Paralel → tegangan sama pada L2 dan L3. Pernyataan 5 <b>benar</b>.`
    ]
  },
  {
    topic:'Kelistrikan', type:'MAT',
    ctx:`Partikel debu bermuatan (−) masuk ke tengah-tengah dua pelat logam. Pelat A (+), Pelat B (−).`,
    items:[
      {t:`Arah medan listrik statis di antara kedua pelat adalah dari Pelat B menuju Pelat A.`,key:0},
      {t:`Partikel debu akan mengalami gaya Coulomb dengan arah menuju Pelat A.`,key:1},
      {t:`Jika jarak pelat dijauhkan tanpa mencabut baterai, kuat medan listrik di antara pelat membesar.`,key:0}
    ],
    concept:`Medan listrik E = V/d, arah dari (+) ke (−). Gaya Coulomb F = qE. Muatan (−) mengalami gaya berlawanan arah medan.`,
    steps:[
      `Medan listrik arahnya dari (+) ke (−) = dari Pelat A ke Pelat B, bukan sebaliknya. Pernyataan 1 <b>salah</b>.`,
      `Debu bermuatan (−) ditarik oleh Pelat A (+). Pernyataan 2 <b>benar</b>.`,
      `E = V/d. Jika d diperbesar, E mengecil, bukan membesar. Pernyataan 3 <b>salah</b>.`
    ]
  }
];

/* ============ RENDER ============ */
const LETTER = 'ABCDE';
let currentFilter = 'Semua';

function verdict(key){
  return key
    ? '<span class="shrink-0 text-[11px] font-bold px-2 py-1 rounded-md bg-emerald-100 text-emerald-700">Benar</span>'
    : '<span class="shrink-0 text-[11px] font-bold px-2 py-1 rounded-md bg-rose-100 text-rose-600">Salah</span>';
}

function keyChip(label, key){
  const cls = key ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-600';
  const ic = key ? ICON.check : ICON.cross;
  return `<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-1 rounded-md ${cls}">${label}${ic}</span>`;
}

function card(d, idx){
  const isPGK = d.type === 'PGK';
  const typeLabel = isPGK ? 'Pilihan Ganda Kompleks' : 'Benar / Salah';

  const itemsHTML = d.items.map((it, j) => {
    const letter = isPGK ? LETTER[j] : (j + 1);
    return `<li class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 bg-white">
      <span class="shrink-0 w-6 h-6 rounded-md bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center">${letter}</span>
      <span class="flex-1 text-sm leading-relaxed text-slate-700">${it.t}</span>
      ${verdict(it.key)}
    </li>`;
  }).join('');

  const stepsHTML = d.steps.map((s, i) => `
    <li class="flex gap-2.5">
      <span class="shrink-0 w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 text-[11px] font-bold flex items-center justify-center mt-0.5">${i + 1}</span>
      <span class="text-sm text-slate-700 leading-relaxed">${s}</span>
    </li>`).join('');

  const chipsHTML = d.items.map((it, j) => keyChip(isPGK ? LETTER[j] : (j + 1), it.key)).join('');

  return `<article class="fade-up bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden" data-topic="${d.topic}">
    <div class="p-4 sm:p-6">
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <span class="w-9 h-9 rounded-xl bg-slate-900 text-white font-bold flex items-center justify-center text-sm">${idx + 1}</span>
        <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-100 text-slate-600">${d.topic}</span>
        <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-sky-50 text-sky-700 ring-1 ring-sky-100">${typeLabel}</span>
      </div>
      <p class="text-[15px] leading-relaxed text-slate-700">${d.ctx}</p>
      <p class="mt-4 mb-2 text-[11px] font-bold uppercase tracking-wider text-slate-400">Pernyataan &amp; Kunci</p>
      <ul class="space-y-2">${itemsHTML}</ul>
    </div>
    <div class="bg-emerald-50/50 border-t border-emerald-100 p-4 sm:p-6">
      <div class="flex items-center gap-2 mb-3">
        <span class="w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center">${ICON.book}</span>
        <h4 class="font-bold text-emerald-900 text-sm">Pembahasan Lengkap</h4>
      </div>
      <p class="text-sm text-slate-600 leading-relaxed mb-3"><b class="text-slate-800">Konsep:</b> ${d.concept}</p>
      <ol class="space-y-2.5">${stepsHTML}</ol>
      <div class="mt-4 pt-3 border-t border-emerald-200/60">
        <p class="text-[11px] font-bold uppercase tracking-wider text-emerald-700/70 mb-2">Kunci ringkas</p>
        <div class="flex flex-wrap gap-1.5">${chipsHTML}</div>
      </div>
    </div>
  </article>`;
}

function render(){
  document.getElementById('list').innerHTML = DATA.map(card).join('');
}

function renderFilters(){
  const topics = ['Semua', ...new Set(DATA.map(d => d.topic))];
  document.getElementById('filters').innerHTML = topics.map(t =>
    `<button class="chip${t === currentFilter ? ' active' : ''}" data-chip="${t}" onclick="setFilter('${t}')">${t}</button>`
  ).join('');
}

function setFilter(t){
  currentFilter = t;
  renderFilters();
  let visible = 0;
  document.querySelectorAll('#list article[data-topic]').forEach(a => {
    const show = (t === 'Semua' || a.dataset.topic === t);
    a.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  document.getElementById('counter').textContent = visible + ' soal';
}

/* ============ BACK TO TOP ============ */
const toTop = document.getElementById('toTop');
window.addEventListener('scroll', () => {
  const show = window.scrollY > 400;
  toTop.classList.toggle('opacity-0', !show);
  toTop.classList.toggle('pointer-events-none', !show);
}, { passive: true });

/* ============ INIT ============ */
render();
renderFilters();
</script>
</body>
</html>
